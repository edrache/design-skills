<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generator Przygód — Frieren: Beyond Journey&#x27;s End</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 8mm;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #000;
      background: #fff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      font-size: 7.5px;
      line-height: 1.1;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 4mm;
    }

    .page-header {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 4mm;
      align-items: end;
      border-bottom: 1px solid #000;
      padding-bottom: 2.5mm;
    }

    .title-wrap h1 {
      margin: 0 0 1mm;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .lead {
      margin: 0;
      font-size: 9px;
      color: #222;
      font-style: italic;
    }

    .meta-stack {
      display: flex;
      flex-direction: column;
      gap: 1mm;
      text-align: right;
    }

    .meta-line {
      margin: 0;
      font-size: 10px;
      font-weight: 700;
    }

    .tables-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 3mm;
      align-items: start;
    }

    .table-card {
      border: 1px solid #000;
      border-radius: 3mm;
      background: #fff;
      padding: 2.4mm;
      break-inside: avoid;
    }

    .table-card h2 {
      margin: 0 0 1mm;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 10px;
      line-height: 1.05;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .table-prefix {
      margin: 0 0 1mm;
      font-weight: 700;
    }

    .roll-table {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.55mm;
    }

    .roll-table li {
      display: grid;
      grid-template-columns: 3.6ch 1fr;
      gap: 1mm;
      align-items: start;
    }

    .roll-num {
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="title-wrap">
        <h1>Generator Przygód — Frieren: Beyond Journey&#x27;s End</h1>
        <p class="lead">Tabela do szybkiego generowania przygód dla settingu.</p>
      </div>
      <div class="meta-stack">
        <p class="meta-line">Homebrew World</p>
        <p class="meta-line">Frieren</p>
      </div>
    </header>
    <section class="tables-grid">
      
    </section>
  </main>
</body>
</html>
