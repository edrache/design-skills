<title>World of Dungeons</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ground:      #E9E5DC;
    --text:        #18190E;
    --page-bg:     #191C14;
    --muted:       #8A8478;
    --rule:        #C8C2B4;

    --walka:       #6A1E14;
    --magia:       #1C1A5C;
    --spoleczne:   #164836;
    --eksploracja: #523A10;

    --walka-pale:       #F5EAE8;
    --magia-pale:       #EAEAF5;
    --spoleczne-pale:   #E6F0EC;
    --eksploracja-pale: #F5EDDC;

    --font-serif: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --font-sans:  Optima, Candara, "Gill Sans MT", "Gill Sans", Calibri, sans-serif;
  }

  body {
    background-color: var(--page-bg);
    background-image: repeating-linear-gradient(
      0deg,
      transparent, transparent 31px,
      rgba(255,255,255,0.016) 31px, rgba(255,255,255,0.016) 32px
    );
    min-height: 100vh;
    padding: 3rem 2rem 5rem;
    font-family: var(--font-sans);
    color: var(--text);
  }

  /* ── HEADER ── */
  .header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .header-eyebrow {
    font-size: 0.58rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #484638;
    margin-bottom: 0.6rem;
  }

  .header-title {
    font-family: var(--font-serif);
    font-size: clamp(2.6rem, 7vw, 5rem);
    font-weight: normal;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ground);
    line-height: 1;
  }

  .header-rule {
    width: 44px;
    height: 1px;
    background: #343422;
    margin: 1.4rem auto 0;
  }

  /* ── TAB NAVIGATION ── */
  .tab-nav-wrap {
    max-width: 1300px;
    margin: 0 auto 0;
    border-bottom: 1px solid #252518;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tab-nav-wrap::-webkit-scrollbar { display: none; }

  .tab-nav {
    display: flex;
    gap: 0;
    min-width: max-content;
  }

  .tab-btn {
    padding: 0.7rem 1.3rem;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: #504E3C;
    font-family: var(--font-sans);
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
    outline: none;
  }
  .tab-btn:hover { color: #8A8470; }
  .tab-btn:focus-visible { outline: 1px solid var(--ground); outline-offset: -2px; }
  .tab-btn.active { color: var(--ground); border-bottom-color: var(--ground); }
  .tab-btn[data-tab="zasady"].active          { color: var(--ground); border-bottom-color: #8A8470; }
  .tab-btn[data-tab="alchemia"].active        { color: #C89040; border-bottom-color: #C89040; }
  .tab-btn[data-tab="przyzwanie"].active      { color: #9070C0; border-bottom-color: #9070C0; }
  .tab-btn[data-tab="czarnoksiestwo"].active  { color: #5090A0; border-bottom-color: #5090A0; }
  .tab-btn[data-tab="magiachaosu"].active     { color: #C05040; border-bottom-color: #C05040; }

  /* ── PANELS ── */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── ZDOLNOŚCI PANEL ── */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin: 2rem 0 2.25rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 0.3rem 0.8rem;
    background: transparent;
    border: 1px solid #30301E;
    color: #585648;
    font-family: var(--font-sans);
    font-size: 0.58rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
    outline: none;
  }
  .filter-btn:hover { border-color: #585648; color: #988E7A; }
  .filter-btn:focus-visible { outline: 1px solid var(--ground); outline-offset: 2px; }

  .filter-btn.active[data-cat="all"]          { background: var(--ground); border-color: var(--ground); color: var(--text); }
  .filter-btn.active[data-cat="walka"]        { background: var(--walka); border-color: var(--walka); color: #F2E4E0; }
  .filter-btn.active[data-cat="magia"]        { background: var(--magia); border-color: var(--magia); color: #DCDCF2; }
  .filter-btn.active[data-cat="spoleczne"]    { background: var(--spoleczne); border-color: var(--spoleczne); color: #D0EAE2; }
  .filter-btn.active[data-cat="eksploracja"]  { background: var(--eksploracja); border-color: var(--eksploracja); color: #F0E4C8; }

  .sep { width: 1px; height: 18px; background: #30301E; flex-shrink: 0; margin: 0 0.2rem; }

  .print-btn {
    padding: 0.3rem 0.8rem;
    background: transparent;
    border: 1px solid #30301E;
    color: #585648;
    font-family: var(--font-sans);
    font-size: 0.58rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.12s, color 0.12s;
    outline: none;
  }
  .print-btn:hover { border-color: var(--ground); color: var(--ground); }

  /* ── CARDS GRID ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
    gap: 1.15rem;
    max-width: 1300px;
    margin: 0 auto;
  }

  /* ── CARD ── */
  .card {
    background: var(--ground);
    aspect-ratio: 5 / 7;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    border-left: 5px solid transparent;
    opacity: 0;
    transform: translateY(10px);
    animation: cardIn 0.28s ease forwards;
    transition: transform 0.18s cubic-bezier(0.25,0.46,0.45,0.94), box-shadow 0.18s ease, background 0.18s ease;
  }

  @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

  .card[data-cat="walka"]       { border-left-color: var(--walka); }
  .card[data-cat="magia"]       { border-left-color: var(--magia); }
  .card[data-cat="spoleczne"]   { border-left-color: var(--spoleczne); }
  .card[data-cat="eksploracja"] { border-left-color: var(--eksploracja); }

  .card:hover { transform: translateY(-5px); box-shadow: 0 18px 44px rgba(0,0,0,0.55); }

  .card[data-cat="walka"]:hover       { background: color-mix(in srgb, var(--walka-pale) 35%, var(--ground)); }
  .card[data-cat="magia"]:hover       { background: color-mix(in srgb, var(--magia-pale) 35%, var(--ground)); }
  .card[data-cat="spoleczne"]:hover   { background: color-mix(in srgb, var(--spoleczne-pale) 35%, var(--ground)); }
  .card[data-cat="eksploracja"]:hover { background: color-mix(in srgb, var(--eksploracja-pale) 35%, var(--ground)); }

  .card-inner {
    padding: 0.8rem 0.85rem 0.7rem 0.8rem;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .card-cat { display: flex; align-items: center; gap: 0.35rem; margin-bottom: 0.55rem; flex-shrink: 0; }

  .cat-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .card[data-cat="walka"]       .cat-dot { background: var(--walka); }
  .card[data-cat="magia"]       .cat-dot { background: var(--magia); }
  .card[data-cat="spoleczne"]   .cat-dot { background: var(--spoleczne); }
  .card[data-cat="eksploracja"] .cat-dot { background: var(--eksploracja); }

  .cat-label { font-size: 0.5rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }

  .card-title {
    font-family: var(--font-serif);
    font-weight: normal;
    font-size: 1.22rem;
    line-height: 1.18;
    color: #121410;
    flex-shrink: 0;
    margin-bottom: 0.2rem;
  }

  .card-en {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 0.6rem;
    color: #9C9484;
    flex-shrink: 0;
  }

  .card-rule { border: none; border-top: 1px solid var(--rule); margin: 0.65rem 0; flex-shrink: 0; }

  .card-effect { font-size: 0.67rem; line-height: 1.56; color: #282A1C; flex: 1; }

  .card-footer { margin-top: auto; padding-top: 0.45rem; display: flex; justify-content: flex-end; flex-shrink: 0; }

  .card-source { font-size: 0.48rem; letter-spacing: 0.18em; text-transform: uppercase; color: #B4ACA0; }

  /* ── RULES PANEL ── */
  .rules-panel {
    max-width: 680px;
    margin: 2.5rem auto 0;
    padding: 0 1rem 5rem;
  }

  .r-h1 {
    font-family: var(--font-serif);
    font-weight: normal;
    font-size: 1.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ground);
    margin: 2.5rem 0 1rem;
    line-height: 1.15;
  }
  .r-h1:first-child { margin-top: 0; }

  .r-h2 {
    font-family: var(--font-serif);
    font-weight: normal;
    font-size: 1.2rem;
    color: #C0BC9E;
    margin: 1.8rem 0 0.65rem;
    line-height: 1.25;
  }

  .r-h3 {
    font-family: var(--font-sans);
    font-weight: normal;
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #686448;
    margin: 1.4rem 0 0.45rem;
  }

  .r-p {
    font-size: 0.875rem;
    line-height: 1.72;
    color: #A8A494;
    margin-bottom: 0.65rem;
  }

  .r-p strong { color: #D8D4C4; font-weight: bold; }
  .r-p em    { font-style: italic; color: #B8B4A4; }

  .rules-hr { border: none; border-top: 1px solid #252518; margin: 2rem 0; }

  .r-list {
    list-style: none;
    margin: 0.65rem 0 0.8rem;
    padding: 0;
  }

  .r-list li {
    font-size: 0.875rem;
    line-height: 1.65;
    color: #A8A494;
    padding-left: 1.25rem;
    position: relative;
    margin-bottom: 0.25rem;
  }

  .r-list li::before { content: '—'; position: absolute; left: 0; color: #484830; }

  .r-list strong { color: #D8D4C4; font-weight: bold; }
  .r-list em    { font-style: italic; }

  .r-blockquote {
    border-left: 3px solid #383820;
    padding: 0.5rem 0 0.5rem 1.25rem;
    margin: 1rem 0;
    font-family: var(--font-serif);
    font-size: 0.9rem;
    font-style: italic;
    color: #C0BC9E;
    line-height: 1.6;
  }

  .r-blockquote strong { color: var(--ground); font-style: normal; }

  .r-table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0 1.25rem;
    font-size: 0.8rem;
    overflow-x: auto;
    display: block;
  }

  .r-table th {
    text-align: left;
    color: #888470;
    font-family: var(--font-sans);
    font-size: 0.56rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid #2A2A18;
    font-weight: normal;
    white-space: nowrap;
  }

  .r-table td {
    padding: 0.4rem 0.75rem;
    color: #A0A088;
    border-bottom: 1px solid #1E1E12;
    vertical-align: top;
    line-height: 1.5;
  }

  .r-table td strong { color: #C8C4A8; font-weight: bold; }
  .r-table tr:last-child td { border-bottom: none; }

  /* ── PRINT ── */
  @media print {
    body { background: white; padding: 0; }
    .header, .tab-nav-wrap, .controls { display: none; }
    .panel { display: none !important; }
    #panel-zdolnosci { display: block !important; }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 63mm);
      gap: 2mm;
      padding: 8mm 12mm;
      max-width: none;
    }
    .card {
      width: 63mm; height: 88mm; aspect-ratio: unset;
      border: 0.3pt solid #CCC; border-left: 3pt solid;
      break-inside: avoid; page-break-inside: avoid;
      animation: none; opacity: 1; transform: none !important;
      box-shadow: none !important; background: white !important;
      transition: none;
    }
    .card:hover { transform: none; box-shadow: none; background: white !important; }
    .card-inner { padding: 4pt 5pt; }
    .card-title { font-size: 10pt; }
    .card-effect { font-size: 6.5pt; line-height: 1.4; }
    .card-en { font-size: 6pt; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; transform: none; transition: none; }
  }
</style>

<div class="header">
  <p class="header-eyebrow">Advanced World of Dungeons</p>
  <h1 class="header-title">Podręcznik</h1>
  <div class="header-rule"></div>
</div>

<div class="tab-nav-wrap">
  <nav class="tab-nav" role="tablist">
    <button class="tab-btn active" data-tab="zdolnosci" role="tab" aria-selected="true">Zdolności</button>

</div>

<div class="panel" id="panel-zasady" role="tabpanel">

<!-- PANEL: Alchemia -->
<div class="panel" id="panel-alchemia" role="tabpanel">

</div>

<!-- PANEL: Przyzwanie -->
<div class="panel" id="panel-przyzwanie" role="tabpanel">

</div>

<!-- PANEL: Czarnoksięstwo -->
<div class="panel" id="panel-czarnoksiestwo" role="tabpanel">

  alchemia: `# Alchemia

Alchemia działa podobnie do zaklęć — magia zostaje zamknięta w fizycznej postaci: miksturze, maści lub przedmiocie.

Tworzenie preparatów jest ryzykowne ze względu na żrące substancje i niestabilne składniki. Samo **użycie** gotowego preparatu jest bezpieczne i zazwyczaj nie wymaga rzutu.

  przyzwanie: `# Przyzywanie (Summoning)

Przyzywanie demonów jest jedną z najszybszych dróg do zdobycia ogromnej mocy.

# Warunki przywołania

Aby przyzwać demona, musisz spełnić **jeden** z poniższych warunków:

- Spożyć dawkę **Rtęci Alchemicznej (Quicksilver)**.
- Użyć **magicznego przedmiotu**, w którym demon został wcześniej uwięziony.

- Narysować **krąg przywołania z proszku szmaragdowego**.

Po przywołaniu możesz rozmawiać z demonem i zadawać mu pytania. Demony znają wiele sekretów niedostępnych śmiertelnikom.

---

# Wiązanie demona

Wiązanie jest zawsze ryzykowne. Demony nie chcą służyć śmiertelnikom i przy każdej okazji próbują wypaczyć znaczenie wydanych rozkazów.

Aby związać demona, musisz:

- Przeprowadzić **godzinny rytuał**.
- Narysować **krąg z proszku złota**.
- Spełnić **jeden** z poniższych dodatkowych warunków:
- Posiadać **Kamień Osnowy (Warpstone)**.
- Posiadać fragment ciała przyzywanego ducha lub demona.
- Podpisać z demonem kontrakt.
- Złożyć **ofiarę z 20 Punktów Życia**.

---

# Związane demony

Po związaniu demon staje się twoim sługą. Możesz **raz dziennie** przyzwać go, aby wykonał **jedno polecenie**, bez ryzyka buntu.

Najczęściej demony:

- Odpowiadają na pytania i ujawniają ukrytą wiedzę.
- Wykonują złowrogą magię.
- Realizują pojedyncze zadanie zgodnie z decyzją Mistrza Gry.

Każda prośba wykraczająca poza ten zakres wymaga negocjacji.

Nawet związany demon pozostaje istotą przebiegłą i złośliwą. Jeśli tylko znajdzie sposób, będzie próbował wypaczyć polecenie lub obrócić je przeciw swojemu panu.

---

# Początkowe demony

Przywoływacz rozpoczyna grę z **dwoma związanymi demonami**.

Każdy z nich posiada własne prawdziwe imię, osobowość, wiedzę i moce określane przez Mistrza Gry. Stanowią zarówno potężne narzędzie, jak i nieustanne zagrożenie dla swojego pana.`,

  czarnoksiestwo: `# Czarnoksięstwo (Sorcery)

# Tworzenie zaklęcia

Każde zaklęcie składa się z **trzech elementów**: sposobu rzucania, celu i efektu.

## Sposób rzucania

Wybierz jeden:

### Natychmiastowe

Zaklęcie aktywuje się na początku następnej tury i trwa tak długo, jak długo utrzymujesz koncentrację.

  magiachaosu: `# Magia Chaosu (Wizardry)

Magia Chaosu jest najpotężniejszą, ale również najbardziej niebezpieczną formą magii. W przeciwieństwie do Czarnoksięstwa, czerpie energię bezpośrednio z surowych sił Chaosu. Zaklęcia nie są ograniczone listą efektów — jedynym ograniczeniem jest moc maga i ryzyko wypaczenia rzeczywistości.

- Zaklęcie działa wyłącznie na ciebie lub dotykaną osobę.
- Efekt jest natychmiastowy lub bardzo krótki.

Każdy wydany Punkt Mocy pozwala uzyskać jeden z poniższych efektów:

- Przejąć kontrolę nad bezmyślnymi nieumarłymi w liczbie równej twojej Inteligencji.
- Przejąć kontrolę nad działaniami jednej istoty.
- Stworzyć lub usunąć efekt środowiskowy.

- Nałożyć -1 do dowolnego działania lub -2 do jednego Atrybutu.

- Poznać odpowiedzi na trzy pytania.
- Ożywić bezmyślnych nieumarłych w liczbie równej twojej liczbie Kości Życia.

Efekty można **łączyć**, wydając odpowiednią liczbę Punktów Mocy.

---

# Rzucanie zaklęć

> **2k6 + INT**

/* ── MARKDOWN RENDERER ── */
function inlineFmt(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

function isSeparatorRow(line) {
  return /^\|[\s\-:|]+\|$/.test(line.trim());
}

function mdToHtml(md) {
  const lines = md.split('\n');
  let html = '';
  let inList = false;
  let inTable = false;

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const line = raw.trimEnd();

    if (/^---+\s*$/.test(line)) {
      if (inList)  { html += '</ul>'; inList = false; }
      if (inTable) { html += '</tbody></table>'; inTable = false; }
      html += '<hr class="rules-hr">';
      continue;
    }

    const h1 = line.match(/^# (.+)/);
    const h2 = line.match(/^## (.+)/);
    const h3 = line.match(/^### (.+)/);

    if (h1) {
      if (inList)  { html += '</ul>'; inList = false; }
      if (inTable) { html += '</tbody></table>'; inTable = false; }
      html += `<h1 class="r-h1">${inlineFmt(h1[1])}</h1>`;
      continue;
    }
    if (h2) {
      if (inList)  { html += '</ul>'; inList = false; }
      if (inTable) { html += '</tbody></table>'; inTable = false; }
      html += `<h2 class="r-h2">${inlineFmt(h2[1])}</h2>`;
      continue;
    }
    if (h3) {
      if (inList)  { html += '</ul>'; inList = false; }
      if (inTable) { html += '</tbody></table>'; inTable = false; }
      html += `<h3 class="r-h3">${inlineFmt(h3[1])}</h3>`;
      continue;
    }

    if (line.startsWith('|')) {
      if (isSeparatorRow(line)) continue;
      const cells = line.split('|').slice(1, -1).map(c => c.trim());
      if (!inTable) {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<table class="r-table"><thead><tr>';
        cells.forEach(c => { html += `<th>${inlineFmt(c)}</th>`; });
        html += '</tr></thead><tbody>';
        inTable = true;
      } else {
        html += '<tr>';
        cells.forEach(c => { html += `<td>${inlineFmt(c)}</td>`; });
        html += '</tr>';
      }
      continue;
    } else if (inTable) {
      html += '</tbody></table>';
      inTable = false;
    }

    const li = line.match(/^- (.+)/);
    if (li) {
      if (!inList) { html += '<ul class="r-list">'; inList = true; }
      html += `<li>${inlineFmt(li[1])}</li>`;
      continue;
    } else if (inList && line.trim() !== '') {
      html += '</ul>';
      inList = false;
    }

    if (line.startsWith('> ')) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<blockquote class="r-blockquote">${inlineFmt(line.slice(2))}</blockquote>`;
      continue;
    }

    if (line.trim() === '') continue;

    html += `<p class="r-p">${inlineFmt(line)}</p>`;
  }

  if (inList)  html += '</ul>';
  if (inTable) html += '</tbody></table>';
  return html;
}

/* ── RENDER RULES ── */
Object.entries(RULES_CONTENT).forEach(([key, md]) => {
  const el = document.getElementById('rules-' + key);
  if (el) el.innerHTML = mdToHtml(md);
});

/* ── RENDER CARDS ── */
const grid = document.getElementById('cardsGrid');

function renderCards(filterCat) {
  grid.innerHTML = '';
  const list = filterCat === 'all' ? ABILITIES : ABILITIES.filter(a => a.cat === filterCat);
  list.forEach((a, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.cat = a.cat;
    card.style.animationDelay = `${Math.min(i, 26) * 22}ms`;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-cat">
          <span class="cat-dot"></span>
          <span class="cat-label">${CAT_LABELS[a.cat]}</span>
        </div>
        <h2 class="card-title">${a.pl}</h2>
        <p class="card-en">${a.en}</p>
        <hr class="card-rule" />
        <p class="card-effect">${a.effect}</p>
        <div class="card-footer"><span class="card-source">AWoD</span></div>
      </div>`;
    grid.appendChild(card);
  });
}

/* ── FILTER BUTTONS ── */
document.getElementById('controls').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards(btn.dataset.cat);
});

/* ── TAB SWITCHING ── */
document.querySelector('.tab-nav').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
  btn.classList.add('active');
  btn.setAttribute('aria-selected', 'true');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
});

renderCards('all');
