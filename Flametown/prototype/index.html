<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flametown Prototype</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1b1b1f;
    }

    body {
      min-height: 100vh;
    }

    canvas {
      display: block;
    }

    #ui-panel {
      position: fixed;
      top: 12px;
      right: 12px;
      min-width: 190px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(20, 20, 24, 0.85);
      color: #f0f0f0;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
    }

    #score-panel {
      position: fixed;
      top: 12px;
      left: 12px;
      min-width: 120px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(27, 18, 12, 0.84);
      color: #fff0d5;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 227, 178, 0.16);
    }

    .score-panel-title {
      margin-bottom: 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: rgba(255, 231, 189, 0.74);
    }

    .score-panel-list {
      display: grid;
      gap: 8px;
    }

    .score-row {
      display: grid;
      grid-template-columns: 22px 1fr;
      align-items: center;
      gap: 8px;
    }

    .score-row-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35));
    }

    .score-row-value {
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
    }

    #ui-panel button {
      cursor: pointer;
    }

    #debug-panel {
      position: fixed;
      left: 12px;
      bottom: 12px;
      min-width: 220px;
      max-width: 320px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(20, 20, 24, 0.82);
      color: #f0f0f0;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      font-size: 12px;
      line-height: 1.4;
    }

    #debug-panel button {
      cursor: pointer;
    }

    #version-badge {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 20;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(20, 20, 24, 0.82);
      border: 1px solid rgba(255, 232, 188, 0.18);
      color: rgba(255, 239, 213, 0.92);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      font-size: 12px;
      letter-spacing: 0.08em;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    #tutorial-overlay {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 30;
      pointer-events: none;
    }

    .tutorial-backdrop {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(255, 216, 143, 0.14), transparent 32%),
        linear-gradient(180deg, rgba(9, 13, 18, 0.24), rgba(9, 13, 18, 0.42));
    }

    .tutorial-card {
      position: absolute;
      left: 24px;
      bottom: 24px;
      width: min(420px, calc(100vw - 48px));
      padding: 18px 18px 16px;
      border-radius: 18px;
      background: rgba(21, 16, 12, 0.92);
      border: 1px solid rgba(255, 220, 160, 0.2);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(12px);
      color: #fff3de;
      pointer-events: auto;
    }

    .tutorial-step-label {
      margin-bottom: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: rgba(255, 222, 179, 0.72);
    }

    .tutorial-title {
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.08;
    }

    .tutorial-body,
    .tutorial-instruction,
    .tutorial-status {
      margin: 0 0 10px;
      font-size: 14px;
      line-height: 1.45;
    }

    .tutorial-instruction {
      color: #ffd9a0;
    }

    .tutorial-status {
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 245, 225, 0.82);
    }

    .tutorial-status[data-complete="true"] {
      background: rgba(116, 180, 106, 0.16);
      color: #d7ffd0;
    }

    .tutorial-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tutorial-actions button {
      cursor: pointer;
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      color: #fff4e0;
      background: rgba(255, 255, 255, 0.1);
    }

    .tutorial-actions button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .tutorial-rules-modal {
      position: absolute;
      inset: 24px 24px 24px auto;
      width: min(520px, calc(100vw - 48px));
      display: none;
      flex-direction: column;
      border-radius: 18px;
      background: rgba(18, 14, 11, 0.96);
      border: 1px solid rgba(255, 220, 160, 0.22);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.42);
      color: #fff1dc;
      pointer-events: auto;
      overflow: hidden;
    }

    .tutorial-rules-modal[data-open="true"] {
      display: flex;
    }

    .tutorial-rules-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(255, 220, 160, 0.14);
    }

    .tutorial-rules-header h3 {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
    }

    .tutorial-rules-header button {
      cursor: pointer;
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      color: #fff4e0;
      background: rgba(255, 255, 255, 0.1);
    }

    .tutorial-rules-body {
      overflow: auto;
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .tutorial-rules-section h4 {
      margin: 0 0 8px;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffd8a3;
    }

    .tutorial-rules-section ul {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 8px;
      line-height: 1.45;
    }

    @media (max-width: 720px) {
      .tutorial-card {
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
      }

      .tutorial-rules-modal {
        inset: 12px;
        width: auto;
      }
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="score-panel"></div>
  <div id="ui-panel"></div>
  <div id="version-badge" aria-label="Wersja prototypu" data-version="0.1.12"></div>
  <script type="module" src="src/main.js?v=0.1.12"></script>
</body>
</html>
