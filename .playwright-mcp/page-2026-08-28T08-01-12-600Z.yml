            - generic [ref=f1e504]: "5"
          - paragraph [ref=f1e505]: Po kilku minutach, kilku kolejnych zakrętach i kilku milach w głąb lasu słońce zachodzi. Reflektory samochodu wykrawają w ciemności zaledwie kilka metrów drogi naraz. W końcu światła przesuwają się po froncie chaty i odbijają w dwóch oknach po obu stronach drzwi, które odpowiadają ci złowieszczym spojrzeniem.
          - paragraph [ref=f1e506]: Samochód staje, reflektory gasną. „No wreszcie” — wzdychasz i wysiadasz na żwirowy podjazd. Kiedy obchodzisz auto do bagażnika, żeby pomóc z walizkami, zimne nocne powietrze zaciska się na tobie jak imadło.
          - paragraph [ref=f1e507]: „Głodna jesteś?” — pyta Charlie, a ty starasz się nie szczękać zębami.
