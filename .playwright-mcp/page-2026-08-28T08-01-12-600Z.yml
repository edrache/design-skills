            - generic [ref=f1e499]: "4"
          - paragraph [ref=f1e500]: Charlie wydaje się poirytowany. Siedzicie w samochodzie od ponad trzech godzin, więc to zrozumiałe. Wyciągasz rękę, kładziesz dłoń na jego nodze i ściskasz. Widzisz, jak w odpowiedzi lekko się uśmiecha.
          - paragraph [ref=f1e501]: „Już niedaleko” — mówi Charlie. „Dobrze. Nie mogę się doczekać, kiedy rozprostuję nogi.” Jedziecie dalej, coraz głębiej w las. Dróżka wije się nieregularnie, opada i wznosi, przemykając między wzgórzami. Niebo gubi się w gałęziach sosen. Wieczorne cienie się wydłużają, a ty czujesz, jak z zewnątrz sączy się zimno.
