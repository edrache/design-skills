        - article "Paragraf 22" [active] [ref=e338]:
          - generic [ref=e339]:
            - text: Paragraf
            - generic [ref=e340]: "22"
          - paragraph [ref=e341]: Kiedy film się zaczyna, ekran jest czarny. Słychać cichą muzykę, ale nie ma napisów początkowych. Potem obraz przeskakuje na rozmyte nagranie zrobione wyraźnie kamerą z ręki.
          - paragraph [ref=e342]: „To jeden z domowych filmów Marka?” — pytasz. Charlie się śmieje i sięga po pilota. „O rany. Sorry.”
          - paragraph [ref=e343]: „Chwila, to wygląda znajomo” — mówisz, wskazując na telewizor. Charlie się waha.
          - paragraph [ref=e344]: Na ekranie widzisz ścianę wysokich leśnych drzew. Liście i sosnowe igły chrzęszczą pod stopami tego, kto filmuje. Kamera przesuwa się po krajobrazie, rozmazując zielenie i brązy. I nagle wypatrujesz chatę Marka, stojącą samotnie na swojej małej polanie. Przed nią zaparkowany jest matowoczerwony sedan.
          - paragraph [ref=e345]: „To samochód Julie” — mówi Charlie. „To musiało być po ich weselu.” Kamera drży. Wiatr uderza w mikrofon, wyrzucając z głośników krótką kaskadę okropnego zgrzytu. Przy czerwonym samochodzie coś się rusza. Kobieta, Julie, wyjmuje torby z bagażnika. Uśmiecha się.
          - paragraph [ref=e346]: „No” — mówi Charlie. „To co najmniej pięć, sześć lat temu.”
          - paragraph [ref=e347]: Julie odwraca się, kiedy otwierają się drzwi chaty. Mark wychodzi, podchodzi i bierze od niej jedną z torb. Uśmiechają się i wymieniają niesłyszalne słowa.
          - paragraph [ref=e348]: Prostujesz się jak struna. „Co, do cholery?” „Co się stało? To tylko Mark.” „No właśnie, więc kto filmuje?” Charlie zacina się i mruga. Na ekranie Mark i Julie wchodzą do środka i zamykają za sobą drzwi. Kamera przybliża się do okna. Obraz to ziarnista plama kolorów. Widzisz ruch w chacie. Kamera przybliża się jeszcze bardziej. Wtedy zrywa się ostry wiatr i wyje w głośnikach. Obraz rozbija się w gęstwę głośnego szumu. Biały szum grzmi w całym pomieszczeniu. Dźwięk wwierca się w czaszkę. Masz wrażenie, że rozsadzi ci głowę.
