          - paragraph [ref=e331]: Łapiesz jedną ręką torbę i idziesz do łazienki. „Zaraz wracam” — mówisz i wsuwasz się do środka. W łazience jest jeszcze zimniej. Stawiasz torbę na umywalce i mrugasz do swojego odbicia, które patrzy na ciebie z lustra obok.
          - paragraph [ref=e332]: Drzwi uchylają się ze skrzypnięciem. Wzdychasz i popychasz je z powrotem, ale nie chcą się trzymać. Przyglądasz się bliżej i widzisz małą zasuwkę na wysokości głowy. Drzwi najwyraźniej nie utrzymają się zamknięte, jeśli ich nie zablokujesz. Przewracasz oczami, odpuszczasz drzwi i myjesz zęby.
          - paragraph [ref=e333]: Kilka minut później wracasz do głównego pomieszczenia i przebierasz się, a Charlie cierpliwie czeka na łóżku. Film jest już przygotowany, zatrzymany na początku. Wdrapujesz się na łóżko i też się układasz.
          - paragraph [ref=e334]: „Gotowa na losowy, mam nadzieję-nie-horror?” — pyta Charlie.
