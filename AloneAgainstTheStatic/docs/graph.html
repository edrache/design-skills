r way."},{"id":301,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You try to catch your breath, but it doesn't seem to work. Your hand slides down to the base of the tree, and you collapse down against its roots. You suck air over and over. Your lungs feel icy. Despite the horrible situation you find yourself in, your eyelids feel heavy."},{"id":302,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Pine needles and dirt crunch under your feet as you walk. You make progress, but with every step you feel yourself growing wearier. You need to find somewhere to rest. Maybe some high ground would be good? Or… should you look for a grotto? Anywhere sheltered would be best, right?"},{"id":303,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You turn to face the direction the sound came from. You can't hear it anymore. \"Hello?\" you ask the darkness. It does not reply."},{"id":304,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Before you can finish scanning the area in front of you, the beam of your flashlight flickers and dims. Oh no. Not now! If this thing fails, you'll be left alone in the dark. You slap the top of the flashlight desperately. The beam solidifies, then falters once more. You swear at the flashlight. It…"},{"id":305,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"No! No! Run! You turn away from the voice and race into the darkness. You're almost completely blind in the night, but panic keeps you sprinting as fast as you can. Moonlight just barely reveals a jagged pathway littered with sharp rocks and treacherous tree roots. You try your best to avoid them."},{"id":306,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"It's only luck that keeps you from tripping and smashing your head open on a rock. You stumble through the trees, hands slapping against their trunks to keep your balance. After a minute or so of mad dash, the voice and the hissing static fade. Just as you're about to stop to catch your breath you …"},{"id":307,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Your flashlight flickers. Your heart jumps to your throat. Have the batteries died already? You shake and slap the lens and the beam stabilizes, nice and solid. Phew, lucky you took the time to find new batteries."},{"id":308,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"No. No!"},{"id":309,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Your flashlight goes dead. You shout in frustration and try to shake the damn thing to wake it up. It doesn't work. You're almost blind when you hit the uneven ground. With every step, you risk falling and breaking your neck."},{"id":310,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"It's only dumb luck that keeps you from tripping and smashing your head open on a rock. You stumble through the trees, hands slapping against their trunks to keep your balance. After a minute or so of mad dash, you stop and strain your ears. You can't hear anything behind you. Good, no sense hangin…"},{"id":311,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Your flashlight blinks out just as you reach the uneven ground. You shout in frustration but there's no time to slow down. You rush blindly forward through the woods. For a while, dumb luck keeps you from slipping. Then, the tip of your foot hooks against the lip of some gnarled tree root and you g…"},{"id":312,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"It's impossible to keep your balance. You tumble forward into darkness. You can't even see the ground you're about to slap into. You just know it's going to hurt."},{"id":313,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"For a terrifying second, you're falling through the air. Then, you slap down one foot, find your balance, and catch ahold of a passing tree trunk to stay standing. The recovery hardly slows you down. You keep running forward right away, putting as much distance as possible between you and the stran…"},{"id":314,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"The icy voice isn't far off. You can hear it, just through the trees to your left. You turn towards the sound and peer into the branches. You see nothing. Cautiously, you start to step towards the sound. The ground is uneven and treacherous, but you pick your path carefully. With every step, the ra…"},{"id":315,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You raise your hand and present it out into the darkness. You notice your fingers are trembling slightly. Before your eyes, the shadows that surround you seem to writhe and contort. A long section of dark night bulges from the rest and wraps around your wrist, like a second, colder, hand. It's bris…"},{"id":316,"scene":"forest","end":true,"system":false,"trigger":null,"roll":false,"snippet":"There is no point resisting. Not anymore. You've fought so fiercely to come this far. Now, it's time to give up. You've earned your rest."},{"id":317,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You try to pull back and reject the voice's offer, but you feel a creeping presence push its way into your mind and try to lock around it like a vice. At the same time, the tentacle around your wrist seizes up and starts dragging you forward."},{"id":318,"scene":"forest","end":true,"system":false,"trigger":null,"roll":false,"snippet":"You muster up your strength and try to yank your arm free, but your resolve falters. You can't bring yourself to move with purpose. You feel like you're trapped in molasses. Your thoughts are lethargic. You're overwhelmed. Everything that's happened today is just too much."},{"id":319,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"There's a sickly-sweet voice whispering in your ear. It's telling you to relax. There is no point resisting. Not anymore. You've fought so fiercely to come this far. Now, it's time to give up. You've earned your rest."},{"id":320,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You pick one path and follow it. You race along it for almost an hour. Even after all that time, you're not sure if you've gone the right way. The woods around you are endless. The hills are treacherous. Before long, you lose your bearing. It doesn't matter if you took the right way or wrong way at…"},{"id":321,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Panic is not going to help you get out of these woods. You force yourself to take a few deep breaths and slow your racing heart. You turn, pick a random direction, and start walking determinedly. It's impossible to tell if you made the right call. Your flashlight is the only way to see your surroun…"},{"id":322,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You scurry in one direction, then the other, desperately trying to find some kind of landmark you can use to orientate yourself. You find none. Panic threatens to overwhelm you. The fear only makes you search faster."},{"id":323,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Without light to guide your path, you'd almost certainly break your neck running over the uneven ground ahead. You silently thank your lucky stars that you stopped to add extra batteries to your flashlight. You dodge between the hazards and leave the sound of static behind you. After a minute or so…"},{"id":324,"scene":"forest","end":true,"system":true,"trigger":"spadek punktów wytrzymałości do zera","roll":false,"snippet":"A strange tingling fills your body. For a moment, you feel free and weightless. Then your consciousness retreats. You go limp. You are left alone in the woods, unprotected. There is only silence."},{"id":325,"scene":"cabin","end":false,"system":true,"trigger":"poważna rana","roll":true,"snippet":"Pain shoots through your body. Darkness threatens to overwhelm your vision."},{"id":326,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"The man opens the cabin door. You hear his footsteps running at you in the dark."},{"id":327,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"The cabin isn't very big. Your brother Mark, who owns the place, really exaggerated how luxurious it was. There's only one main room, with a double bed, a chest of drawers, and a corner set up to serve as a kitchen. There's no microwave; both the oven and stove use gas. You see two doors: one leadi…"},{"id":328,"scene":"cabin","end":false,"system":true,"trigger":"trwałe szaleństwo (indefinite insanity)","roll":false,"snippet":"This world is too much for your fragile, mortal, mind. The deep and twisted reality of what lies beyond the wall of human understanding fractures your consciousness like splintering glass."},{"id":329,"scene":"cabin","end":false,"system":true,"trigger":"atak szału — nieudany rzut INT","roll":false,"snippet":"You've seen too much. Your brain short circuits. You blink and try to comprehend what you've just seen. You desperately hope that you will be unable to…"},{"id":330,"scene":"cabin","end":false,"system":true,"trigger":"atak szału: kara do Fighting (Brawl)","roll":false,"snippet":"Jittering, creeping, crawling. The wild is all around you. There are filthy microbes squirming in the soil and horrid nasty monsters lurking in the shadows. It's a connected hive of leeching parasites. An unassailable swarm of horrid insects, that all want to burrow into your skin. You can already …"},{"id":331,"scene":"cabin","end":false,"system":true,"trigger":"atak szału: kara do Spot Hidden","roll":false,"snippet":"There are blurry shapes wriggling at the edges of your vision. Wispy, horrid shapes that move like ghosts. They are creatures of the forest. They are lurking, laughing, calling out to you."},{"id":332,"scene":"cabin","end":false,"system":true,"trigger":"atak szału: kara do Persuade i Intimidate","roll":false,"snippet":"You're seeing faces where there aren't any. In wood grain, in the sky, and in dancing shadow. Some are familiar, some are not, some are wholly alien. You can trust none of them. Every face in these hills is wicked. You are certain some twisted dryad of a forgotten age lurks inches beneath their fle…"},{"id":333,"scene":"cabin","end":false,"system":true,"trigger":"atak szału: kara do Listen","roll":false,"snippet":"Something is talking to you. There's a voice at the very edge of your hearing. You cannot get it to stop whispering. Its words are laced with static. They promise you wonders and play on your every fear. Whenever you try to understand exactly what's being said, the voice vanishes, but never for lon…"},{"id":334,"scene":"forest","end":true,"system":true,"trigger":"spadek poczytalności do zera","roll":false,"snippet":"\"Mine…\""},{"id":335,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"Hello?\" you call out. You struggle to keep terror, or anger, from creeping into your voice. The man approaches you. He's smiling."},{"id":336,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"Alex,\" he says."},{"id":337,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"You keep calling it a child,\" you say. \"What actually is it?\""},{"id":338,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"The Child…,\" you say. \"It wants a family?\""},{"id":339,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"It is a burden, this knowledge.\" The man smiles. \"I came to this place years ago. I brought my camera. I wanted to document the wild, but I found something far more important to document. Something beyond comprehension. I found that the Child could somehow manipulate the magnetic particles in my v…"},{"id":340,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"You… are you the guy I've seen around?\""},{"id":341,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You shake your head. \"This… this is nonsense.\""},{"id":342,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You spin away from the man. There, standing on the edge of the clearing, is Charlie. Their clothes are flaked with mud and dirt, and there are twigs caught in their hair. But they're here. They're alive. They're smiling at you."},{"id":343,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You dash across the clearing and cling to Charlie. \"Oh my god! I've been so worried!\" You hold them close against you."},{"id":344,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"Really?\" Charlie asks."},{"id":345,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You can't let Charlie throw everything away. You try pleading with them."},{"id":346,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"It will always be worth it,\" you say. \"I love you, and I'll always love you.\" Charlie's face remains impassive. Then, it splits into a warm smile."},{"id":347,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"A memory of flesh splitting, giving way to monstrous black tentacles, leaps into your mind. You've already seen the Child. You know what's coming next. Before you, Charlie's face bulges. Pine needles sprout from their cheeks and emerge, covered in blood. Their mouth opens and a thick fleshy tentacl…"},{"id":348,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You can't bring yourself to answer. Your mouth just opens and shuts, like a fish's. Charlie watches you for a long time, then bows their head. Your heart drops."},{"id":349,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"It has to be worth it,\" you say. \"Please. Please Charlie! It has to be.\" Charlie's face remains impassive. Then, they shake their head."},{"id":350,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"How can I get out of here?\""},{"id":351,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Something in the base of your consciousness is sounding a terrible alarm, but another equally strong part is telling you to run over and embrace the person that you love."},{"id":352,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Charlie hugs you back. \"I know you have. Don't worry. Everything is going to be okay now. We're all together now.\" You feel Charlie's hands stroking at the back of your head. You pull away. You don't have time for this right now."},{"id":353,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"We will be together?\""},{"id":354,"scene":"forest","end":true,"system":false,"trigger":null,"roll":false,"snippet":"The darkness lifts. The light of dawn brings you to wake. You don't recall how much time has passed. It might be years later, or could it be years earlier?"},{"id":355,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Whatever this thing is, it isn't your partner. You're pretty sure it might have killed them. Even if it means you end up dead, you refuse to let this monster get away unharmed. As the horrific mutation proceeds, you lunge forward and attack, striking wildly with all your might."},{"id":356,"scene":"clearing","end":true,"system":false,"trigger":null,"roll":false,"snippet":"Whipping tentacles snap out and catch both your wrists before you can land a blow. You struggle against them. A third tentacle rises into the air in front of you. Its tip is sharp. Behind it, your partner's body has all but disintegrated now. Only their face remains. What's left is an amalgamation …"},{"id":357,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"No,\" you say. \"I don't want that.\""},{"id":358,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You take one last look at your partner's body. It's disintegrating, turning into something foul before your eyes. There is nothing left you can do for them. It doesn't matter how you feel about them, what you wanted for them, some greater force has decided for you. All you can do now, is run."},{"id":359,"scene":"clearing","end":true,"system":false,"trigger":null,"roll":false,"snippet":"You never make it to the edge of the clearing. Just as you're about to break into the trees you hear a footstep right next to you. You catch sight of a tentacle whipping in your direction. You throw yourself sideways and manage to avoid the blow, but you tumble down and land on your hands and knees…"},{"id":360,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You run through the forest. You jump logs, duck under low-hanging branches, deftly avoid the moss-ridden stones. For a while you hear the sounds of pursuit, but terror, rage, and anguish pushes you to run for far longer than you ever have before. Eventually, the sounds of pursuit fade. You keep run…"},{"id":361,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You turn the dagger over in your hands—your muted and twisted reflection blinks up at you from the length of the blade. This distortion makes you look old. You tilt the dagger and the reflection shifts. Now, you look younger than you really are."},{"id":362,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You see your distorted reflection in the dagger's blade. It makes you think about funhouse mirrors, like the ones at a tourist beach town you visited as a kid."},{"id":363,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Looking down at the face of what you thought was your loving partner, you watch as the distortion of flesh, tentacle, tooth, and vein erupts from their neck, their jaw—even their eyes. Between the writhing and ever-expanding mutation, you see flashes of their true face, the one you fell in love wit…"},{"id":364,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You grip the hilt of the dagger tight in your fist. You raise it high and with a great wail that pierces the dark, you drive the blade squarely into the chest of the horrid creature."},{"id":365,"scene":"clearing","end":true,"system":false,"trigger":null,"roll":false,"snippet":"You stand in the clearing for hours. Waiting for something, anything to change. But nothing does. Eventually, the sun rises. From somewhere over the horizon, you hear a bird song. The sound jerks you from your stillness."},{"id":366,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Looking at the clearing—the tent, the campfire, the strange constellations of stars in the void above—you know in your gut nothing good will come of this place. It's an instinct, something primal in your heart that you do not understand but know you must listen to."},{"id":367,"scene":"forest","end":true,"system":false,"trigger":null,"roll":false,"snippet":"An hour later and you're sitting in the passenger seat of a truck next to a long-haul driver named Lance. You've been quiet since he picked you up and even though you keep noticing him glancing at you, you say nothing."},{"id":368,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You slip your shoes on and step out of the cabin. You trudge through the foliage that skirts the cabin walls as you make your way around the building, looking for the generator."},{"id":369,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You check the wires from the batteries. They're not frayed and are still connected properly to the meter box. The batteries don't look too old. Maybe ‘88 models. Each should store enough power to run lights alone for a few days. A TV would only reduce that by half."},{"id":370,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"With a sigh, you head back inside and slip off your shoes. You close the door behind you. It's nice, in a way, to feel so removed from the world, but still safe and secure in this little room. Like a pocket of the modern day planted in the wilderness."},{"id":371,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You reach in to check the wires running from the big batteries to the little box. One comes loose in your hand. You're unsure if it was already unplugged or if you somehow unplugged it when you checked to see if it was secure."}],"edges":[{"from":1,"to":7,"kind":"choice","label":"Dalej proponować pomoc"},{"from":1,"to":3,"kind":"choice","label":"Zmienić zamiast tego stację radiową"},{"from":2,"to":83,"kind":"choice","label":"Poprosić Alex, żeby przestała"},{"from":2,"to":96,"kind":"choice","label":"Po prostu zignorować dźwięk"},{"from":3,"to":4,"kind":"success","label":"Psychology: sukces"},{"from":3,"to":8,"kind":"fail","label":"Psychology: porażka"},{"from":4,"to":5,"kind":"auto","label":""},{"from":5,"to":6,"kind":"choice","label":"Powiedzieć, że jesteś głodna"},{"from":5,"to":12,"kind":"choice","label":"Powiedzieć, że nie jesteś głodna"},{"from":6,"to":11,"kind":"auto","label":"" const nodes = DATA.nodes;
const edges = DATA.edges;
const byId = new Map(nodes.map((n) => [n.id, n]));
const startIds = [...new Set(Object.values(DATA.starts))].filter((id) => byId.has(id));

const out = new Map(), inc = new Map();
for (const n of nodes) { out.set(n.id, []); inc.set(n.id, []); }
for (const e of edges) {
  if (!byId.has(e.from) || !byId.has(e.to)) continue;
  out.get(e.from).push(e);
  inc.get(e.to).push(e);
}

/* ---------- warstwy ---------- */
// Główny graf układamy od paragrafów startowych. Paragrafy systemowe (rany,
// poczytalność, atak szału) nie mają dojścia z fabuły — silnik wchodzi w nie
// z reguł gry, więc lądują w osobnej kolumnie z boku, zamiast zaśmiecać
// pierwsze poziomy drzewa.
const depth = new Map();
const bfs = (roots) => {
  for (const root of roots) {
    if (depth.has(root)) continue;
    depth.set(root, 0);
    const queue = [root];
    while (queue.length) {
      const id = queue.shift();
      for (const e of out.get(id)) {
        if (depth.has(e.to)) continue;
        depth.set(e.to, depth.get(id) + 1);
        queue.push(e.to);
      }
    }
  }
};
bfs(startIds);
const mainIds = nodes.map((n) => n.id).filter((id) => depth.has(id));
const asideIds = nodes.map((n) => n.id).filter((id) => !depth.has(id));
bfs([...asideIds].sort((a, b) => inc.get(a).length - inc.get(b).length || a - b));

// Prolog Alexa i prolog Charliego biegną osobno, aż zejdą się w tym samym
// paragrafie. Rozdzielamy je na pasma: wyłączne dla Alexa po lewej, wspólny
// trzon w środku, wyłączne dla Charliego po prawej.
const reachFrom = (root) => {
  const seen = new Set([root]);
  const queue = [root];
  while (queue.length) {
    const id = queue.shift();
    for (const e of out.get(id)) {
      if (seen.has(e.to)) continue;
      seen.add(e.to);
      queue.push(e.to);
    }
  }
  return seen;
};
const branchNames = Object.keys(DATA.starts);
const reachA = startIds[0] !== undefined ? reachFrom(startIds[0]) : new Set();
const reachC = startIds[1] !== undefined ? reachFrom(startIds[1]) : new Set();
const bandOf = (id) => {
  if (reachA.has(id) && !reachC.has(id)) return 0;
  if (reachC.has(id) && !reachA.has(id)) return 2;
  return 1;
};

const buildLayers = (ids) => {
  if (!ids.length) return [];
  const max = Math.max(...ids.map((id) => depth.get(id)));
  const result = Array.from({ length: max + 1 }, () => []);
  for (const id of ids) result[depth.get(id)].push(id);
  return result;
};

// Kilka przebiegów barycentrycznych, żeby ograniczyć plątaninę krawędzi.
const order = new Map();
const orderLayers = (layers) => {
  const reindex = () => layers.forEach((layer) => layer.forEach((id, i) => order.set(id, i)));
  reindex();
  for (let pass = 0; pass < 12; pass += 1) {
    const down = pass % 2 === 0;
    const seq = layers.map((_, i) => (down ? i : layers.length - 1 - i));
    for (const li of seq) {
      const keys = new Map(layers[li].map((id) => {
        const vals = (down ? inc.get(id).map((e) => e.from) : out.get(id).map((e) => e.to))
          .filter((other) => depth.get(other) === (down ? li - 1 : li + 1))
          .map((other) => order.get(other))
          .filter((value) => value !== undefined);
        return [id, vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : order.get(id)];
      }));
      layers[li].sort((a, b) => bandOf(a) - bandOf(b) || keys.get(a) - keys.get(b) || a - b);
      reindex();
    }
  }
  return layers;
};

const layers = orderLayers(buildLayers(mainIds));
const asideLayers = orderLayers(buildLayers(asideIds));

const COL = NODE_W + GAP_X;
const BAND_GAP = 90;

// Szerokość pasma wyznacza najszersza warstwa w tym paśmie.
const bandWidth = [0, 1, 2].map((band) =>
  Math.max(0, ...layers.map((layer) => layer.filter((id) => bandOf(id) === band).length)) * COL);
const bandX = [40];
bandX[1] = bandX[0] + bandWidth[0] + (bandWidth[0] ? BAND_GAP : 0);
bandX[2] = bandX[1] + bandWidth[1] + (bandWidth[2] ? BAND_GAP : 0);
const mainW = bandX[2] + bandWidth[2] + 40;
const asideW = asideLayers.length ? Math.max(...asideLayers.map((l) => l.length)) * COL + 80 : 0;
const asideX = mainW + 120;

const pos = new Map();
layers.forEach((layer, li) => {
  for (const band of [0, 1, 2]) {
    const group = layer.filter((id) => bandOf(id) === band);
    if (!group.length) continue;
    const startX = bandX[band] + (bandWidth[band] - group.length * COL) / 2;
    group.forEach((id, i) => pos.set(id, { x: startX + i * COL, y: 60 + li * ROW_H }));
  }
});
asideLayers.forEach((layer, li) => {
  const startX = asideX + (asideW - layer.length * COL) / 2;
  layer.forEach((id, i) => pos.set(id, { x: startX + i * COL, y: 60 + li * ROW_H }));
});

const stageW = mainW + (asideW ? 120 + asideW : 0);
const stageH = 60 + Math.max(layers.length, asideLayers.length) * ROW_H;

  marker.setAttribute("id", `arrow-${kind}`);
  marker.setAttribute("viewBox", "0 0 8 8");
  marker.setAttribute("refX", "7"); marker.setAttribute("refY", "4");
  marker.setAttribute("markerWidth", "5"); marker.setAttribute("markerHeight", "5");
  marker.setAttribute("orient", "auto-start-reverse");
  const path = document.createElementNS(NS, "path");
  path.setAttribute("d", "M0,1 L8,4 L0,7 z");
  path.setAttribute("fill", color);
  marker.appendChild(path);
  defs.appendChild(marker);
}

const bandLabels = [
  branchNames[0] ? `tylko ${branchNames[0]}` : null,
  "wspólne",
  branchNames[1] ? `tylko ${branchNames[1]}` : null,
];
bandLabels.forEach((text, band) => {
  if (!text || !bandWidth[band]) return;
  const label = document.createElementNS(NS, "text");
  label.setAttribute("class", "layer-label");
  label.setAttribute("x", bandX[band] + bandWidth[band] / 2);
  label.setAttribute("y", 36);
  label.setAttribute("text-anchor", "middle");
  label.textContent = text;
  gLabels.appendChild(label);
});

if (asideLayers.length) {
  const divider = document.createElementNS(NS, "line");
  divider.setAttribute("x1", asideX - 60); divider.setAttribute("x2", asideX - 60);
  divider.setAttribute("y1", 20); divider.setAttribute("y2", stageH);
  divider.setAttribute("stroke", "#232a33"); divider.setAttribute("stroke-dasharray", "4 6");
  gLabels.appendChild(divider);
  const caption = document.createElementNS(NS, "text");
  caption.setAttribute("class", "layer-label");
  caption.setAttribute("x", asideX);
  caption.setAttribute("y", 36);
  caption.textContent = "paragrafy systemowe — wywoływane przez zasady gry";
  gLabels.appendChild(caption);
}

layers.forEach((layer, li) => {
  if (!layer.length) return;
  const label = document.createElementNS(NS, "text");
  label.setAttribute("class", "layer-label");
  label.setAttribute("x", "8");
  label.setAttribute("y", 60 + li * ROW_H + NODE_H / 2);
  label.textContent = `poz. ${li}`;
  gLabels.appendChild(label);
});

const edgeEls = [];
const edgePath = (e) => {
  const a = pos.get(e.from), b = pos.get(e.to);
  const x1 = a.x + NODE_W / 2, x2 = b.x + NODE_W / 2;
  if (b.y > a.y) {
    const y1 = a.y + NODE_H, y2 = b.y;
    const dy = (y2 - y1) * 0.45;
    return `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}`;
  }
  // Krawędź wsteczna albo w poziomie: prowadzimy ją łukiem obok kolumn.
  const y1 = a.y + NODE_H / 2, y2 = b.y + NODE_H / 2;
  const bow = 60 + Math.abs(y1 - y2) * 0.25;
  const dir = x2 >= x1 ? 1 : -1;
  return `M${x1},${y1} C${x1 + dir * bow},${y1 + 30} ${x2 + dir * bow},${y2 - 30} ${x2},${y2}`;
};
for (const e of edges) {
  if (!pos.has(e.from) || !pos.has(e.to)) continue;
  const path = document.createElementNS(NS, "path");
  path.setAttribute("class", `edge ${e.kind}`);
  path.setAttribute("d", edgePath(e));
  path.setAttribute("marker-end", `url(#arrow-${e.kind})`);
  gEdges.appendChild(path);
  edgeEls.push({ el: path, e });
}

const nodeEls = new Map();
for (const n of nodes) {
  const p = pos.get(n.id);
  const g = document.createElementNS(NS, "g");
  const classes = ["node"];
  if (n.end) classes.push("end");
  if (n.system) classes.push("system");
  if (startIds.includes(n.id)) classes.push("start");
  g.setAttribute("class", classes.join(" "));
  g.setAttribute("transform", `translate(${p.x},${p.y})`);
  const rect = document.createElementNS(NS, "rect");
  rect.setAttribute("width", NODE_W); rect.setAttribute("height", NODE_H);
  rect.setAttribute("rx", "4");
  rect.setAttribute("fill", SCENE_COLOR[n.scene] ?? "#9aa3ad");
  rect.setAttribute("stroke", "#0b0d10");
  const label = document.createElementNS(NS, "text");
  label.setAttribute("x", NODE_W / 2); label.setAttribute("y", NODE_H / 2);
  label.textContent = n.id;
  g.append(rect, label);
  g.addEventListener("mouseenter", () => { if (!pinned) focus(n.id); });
  g.addEventListener("mouseleave", () => { if (!pinned) clearFocus(); });
  g.addEventListener("click", (event) => { event.stopPropagation(); pinned = n.id; focus(n.id); });
  gNodes.appendChild(g);
  nodeEls.set(n.id, g);
}

/* ---------- podświetlanie ---------- */
let pinned = null;
const walk = (id, map, key) => {
  const seen = new Set([id]);
  const queue = [id];
  while (queue.length) {
    const current = queue.shift();
    for (const e of map.get(current)) {
      const next = e[key];
      if (seen.has(next)) continue;
      seen.add(next);
      queue.push(next);
    }
  }
  seen.delete(id);
  return seen;
};

const clearFocus = () => {
  svg.classList.remove("focused");
  nodeEls.forEach((el) => el.classList.remove("anc", "desc", "self"));
  edgeEls.forEach(({ el }) => el.classList.remove("hl-anc", "hl-desc"));
  if (!pinned) renderPanel(null);
};

const focus = (id) => {
  clearFocus();
  svg.classList.add("focused");
  const anc = walk(id, inc, "from");
  const desc = document.getElementById("down").checked ? walk(id, out, "to") : new Set();
  anc.forEach((a) => nodeEls.get(a)?.classList.add("anc"));
  desc.forEach((d) => { if (!anc.has(d)) nodeEls.get(d)?.classList.add("desc"); });
  nodeEls.get(id)?.classList.add("self");
  for (const { el, e } of edgeEls) {
    if (anc.has(e.from) && (anc.has(e.to) || e.to === id)) el.classList.add("hl-anc");
    else if (desc.size && (desc.has(e.to) || e.to === id) && (desc.has(e.from) || e.from === id)) el.classList.add("hl-desc");
  }
  renderPanel(id, anc, desc);
};

/* ---------- panel ---------- */
const shortestPath = (target) => {
  const prev = new Map();
  const queue = [...startIds];
  const seen = new Set(startIds);
  while (queue.length) {
    const id = queue.shift();
    if (id === target) break;
    for (const e of out.get(id)) {
      if (seen.has(e.to)) continue;
      seen.add(e.to);
      prev.set(e.to, e);
      queue.push(e.to);
    }
  }
  if (!seen.has(target)) return null;
  const chain = [];
  let cursor = target;
  while (prev.has(cursor)) {
    const e = prev.get(cursor);
    chain.unshift(e);
    cursor = e.from;
  }
  return { start: cursor, chain };
};

const esc = (value) => String(value).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const startName = (id) => {
  const key = Object.entries(DATA.starts).find(([, value]) => value === id)?.[0];
  return key ? ` (start: ${key})` : "";
};
const numLink = (id) => `<span class="num" data-goto="${id}">${id}</span>`;

const panel = document.getElementById("panel");
const legendHtml = () => `
  <h3>Rodzaje połączeń</h3>
  <div class="legend">${Object.entries(KINDS).map(([k, v]) =>
    `<span><i style="border-color:${KIND_COLOR[k]}"></i>${v}</span>`).join("")}</div>
  <h3>Sceny</h3>
  <div class="legend">${Object.entries(SCENE_COLOR).map(([k, v]) =>
    `<span><i class="swatch" style="background:${v};border:0;height:10px"></i>${k}</span>`).join("")}</div>
  <p class="hint">Najedź na numer — podświetli się całe drzewo dojść do tego paragrafu.
  Kliknij, żeby przypiąć widok (Esc albo „wyczyść” zdejmuje). Kółko myszy przybliża, przeciąganie przesuwa.
  Czerwona ramka to zakończenie, przerywana — paragraf systemowy (rany, poczytalność).</p>`;

function renderPanel(id, anc = new Set(), desc = new Set()) {
  if (id === null) { panel.innerHTML = `<h2>Paragrafy</h2>${legendHtml()}`; return; }
  const n = byId.get(id);
  const parents = inc.get(id);
  const children = out.get(id);
  const path = shortestPath(id);
  const rel = (list, key) => list.length
    ? list.map((e) => `<div class="rel">${numLink(e[key])}<span class="lbl">${esc(e.label || KINDS[e.kind])}</span></div>`).join("")
    : `<div class="rel"><span class="lbl">—</span></div>`;

  panel.innerHTML = `
    <h2>Paragraf ${id}</h2>
    <div class="lbl" style="color:var(--muted)">scena: ${esc(n.scene)}${n.end ? " · zakończenie" : ""}${n.system ? " · systemowy" : ""}${n.roll ? " · rzut" : ""}</div>
    <div class="snippet">${esc(n.snippet)}</div>
    ${n.trigger ? `<div class="lbl" style="color:var(--muted)">wywoływany przez zasady: ${esc(n.trigger)}</div>` : ""}
    <h3>Najkrótsza droga od startu</h3>
    <div class="path">${path
      ? [`${numLink(path.start)}<span class="lbl">${startName(path.start)}</span>`, ...path.chain.map((e) => `<span class="lbl">${esc(e.kind === "choice" ? "wybór" : KINDS[e.kind])}</span> → ${numLink(e.to)}`)].join(" ")
      : "<span class=\"lbl\">brak drogi od paragrafu startowego (wejście przez zasady gry)</span>"}</div>
    <h3>Wchodzi z (${parents.length}) · przodków: ${anc.size}</h3>
    ${rel(parents, "from")}
    <h3>Prowadzi do (${children.length})${desc.size ? ` · potomków: ${desc.size}` : ""}</h3>
    ${rel(children, "to")}
    ${legendHtml()}`;
}

panel.addEventListener("click", (event) => {
  const target = event.target.closest("[data-goto]");
  if (!target) return;
  const id = Number(target.dataset.goto);
  pinned = id;
  focus(id);
  centerOn(id);
});

/* ---------- zoom i przesuwanie ---------- */
let scale = 0.75, tx = 0, ty = 0, touched = false;
const apply = () => viewport.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
const stage = document.getElementById("stage");

const fit = () => {
  touched = true;
  const box = stage.getBoundingClientRect();
  if (!box.width || !box.height) { requestAnimationFrame(fit); return; }
  scale = Math.max(0.05, Math.min(box.width / stageW, box.height / stageH) * 0.95);
  tx = (box.width - stageW * scale) / 2;
  ty = 10;
  apply();
};
const centerOn = (id) => {
  const p = pos.get(id);
  if (!p) return;
  touched = true;
  const box = stage.getBoundingClientRect();
  if (!box.width || !box.height) { requestAnimationFrame(() => centerOn(id)); return; }
  if (scale < 0.7) scale = 1;
  tx = box.width / 2 - (p.x + NODE_W / 2) * scale;
  ty = box.height / 2 - (p.y + NODE_H / 2) * scale;
  apply();
};

stage.addEventListener("wheel", (event) => {
  event.preventDefault();
  const box = stage.getBoundingClientRect();
  const mx = event.clientX - box.left, my = event.clientY - box.top;
  touched = true;
  const next = Math.min(4, Math.max(0.08, scale * Math.exp(-event.deltaY * 0.0015)));
  tx = mx - (mx - tx) * (next / scale);
  ty = my - (my - ty) * (next / scale);
  scale = next;
  apply();
}, { passive: false });

let drag = null;
stage.addEventListener("pointerdown", (event) => {
  touched = true;
  drag = { x: event.clientX - tx, y: event.clientY - ty };
  stage.classList.add("dragging");
  stage.setPointerCapture(event.pointerId);
});
stage.addEventListener("pointermove", (event) => {
  if (!drag) return;
  tx = event.clientX - drag.x; ty = event.clientY - drag.y;
  apply();
});
stage.addEventListener("pointerup", () => { drag = null; stage.classList.remove("dragging"); });
stage.addEventListener("click", (event) => {
  if (event.target.closest(".node")) return;
  pinned = null;
  clearFocus();
});

/* ---------- sterowanie ---------- */
document.getElementById("fit").addEventListener("click", fit);
document.getElementById("clear").addEventListener("click", () => { pinned = null; clearFocus(); });
document.getElementById("down").addEventListener("change", () => { if (pinned) focus(pinned); });
document.getElementById("search").addEventListener("keydown", (event) => {
  if (event.key !== "Enter") return;
  const id = Number(event.currentTarget.value.trim());
  if (!byId.has(id)) return;
  pinned = id;
  focus(id);
  centerOn(id);
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") { pinned = null; clearFocus(); }
});

document.getElementById("stats").textContent =
  `${nodes.length} paragrafów · ${edges.length} połączeń · ${layers.length} poziomów · ${nodes.filter((n) => n.end).length} zakończeń`;

renderPanel(null);
// Start: widok od pierwszego paragrafu w czytelnej skali; „dopasuj” pokazuje całość.
requestAnimationFrame(() => {
  if (touched) return;
  const box = stage.getBoundingClientRect();
  if (!box.width) { requestAnimationFrame(fit); return; }
  scale = 1;
  tx = box.width / 2 - (pos.get(startIds[0]).x + NODE_W / 2) * scale;
  ty = 40;
  apply();
});
</script>
</body>
</html>
