<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alone Against the Static — drzewo paragrafów</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #12161b;
    --line: #232a33;
    --ink: #d8dee6;
    --muted: #7d8895;
    --accent: #e0b25a;
    --anc: #f2c14e;
    --desc: #5aa9e6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 "Iosevka", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    display: grid;
    grid-template-columns: 1fr 330px;
    grid-template-rows: auto 1fr;
    height: 100vh;
    overflow: hidden;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  h1 { font-size: 14px; margin: 0; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .stats { color: var(--muted); }
  .controls { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  input[type="search"] {
    background: #0b0e12; border: 1px solid var(--line); color: var(--ink);
    padding: 5px 8px; width: 150px; font: inherit; border-radius: 3px;
  }
  button {
    background: #1a2029; border: 1px solid var(--line); color: var(--ink);
    padding: 5px 10px; font: inherit; border-radius: 3px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  label.toggle { display: flex; align-items: center; gap: 5px; color: var(--muted); cursor: pointer; }
  #stage { position: relative; overflow: hidden; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  svg { display: block; width: 100%; height: 100%; }
  .edge { fill: none; stroke-width: 1.1; opacity: 0.35; }
  .edge.choice { stroke: #8d97a5; }
  .edge.auto { stroke: #4b5563; }
  .edge.success { stroke: #4c9a68; }
  .edge.fail { stroke: #b0524f; }
  .edge.pushed { stroke: #7d3f6d; stroke-dasharray: 2 3; }
  .edge.guard { stroke: #3f7d8c; stroke-dasharray: 5 3; }
  .edge.cond { stroke: #7c6bb0; stroke-dasharray: 5 3; }
  .edge.book { stroke: #4a4a4a; stroke-dasharray: 1 4; }
  .node rect { stroke-width: 1; }
  .node text { font-size: 11px; fill: #0b0d10; text-anchor: middle; dominant-baseline: central; font-weight: 600; pointer-events: none; }
  .node { cursor: pointer; }
  .node.end rect { stroke: #e05c5c; stroke-width: 2; }
  .node.system rect { stroke-dasharray: 3 2; }
  .node.start rect { stroke: var(--accent); stroke-width: 2.5; }
  .layer-label { fill: #39424e; font-size: 10px; }

  /* Tryb skupienia: wygaszamy wszystko poza podświetlonym poddrzewem. */
  svg.focused .edge { opacity: 0.05; }
  svg.focused .node { opacity: 0.18; }
  svg.focused .node.anc, svg.focused .node.self, svg.focused .node.desc { opacity: 1; }
  svg.focused .edge.hl-anc { opacity: 0.95; stroke-width: 2; }
  svg.focused .edge.hl-desc { opacity: 0.5; stroke-width: 1.4; stroke: var(--desc); }
  svg.focused .node.anc rect { stroke: var(--anc); stroke-width: 2; }
  svg.focused .node.desc rect { stroke: var(--desc); stroke-width: 1.5; }
  svg.focused .node.self rect { stroke: #fff; stroke-width: 3; }

  aside {
    border-left: 1px solid var(--line);
    background: var(--panel);
    padding: 14px;
    overflow-y: auto;
  }
  aside h2 { font-size: 12px; margin: 0 0 6px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  aside h3 { font-size: 11px; margin: 16px 0 6px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .snippet { color: var(--muted); font-size: 12px; border-left: 2px solid var(--line); padding-left: 8px; margin: 8px 0; }
  .rel { margin: 3px 0; display: flex; gap: 6px; align-items: baseline; }
  .rel .num { color: var(--accent); cursor: pointer; text-decoration: underline dotted; }
  .rel .lbl { color: var(--muted); font-size: 11px; }
  .path { line-height: 1.9; word-break: break-word; }
  .path .num { color: var(--anc); cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 6px; color: var(--muted); font-size: 11px; }
  .legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; margin-right: 4px; vertical-align: middle; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .hint { color: #5b6673; font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>Alone Against the Static — drzewo paragrafów</h1>
  <span class="stats" id="stats"></span>
  <div class="controls">
    <label class="toggle"><input type="checkbox" id="down"> pokaż też w dół</label>
    <input type="search" id="search" placeholder="nr paragrafu…" inputmode="numeric">
    <button id="fit">dopasuj</button>
    <button id="clear">wyczyść</button>
  </div>
</header>
<div id="stage"><svg id="svg"></svg></div>
<aside id="panel"></aside>

<script>
const DATA = {"starts":{"alex":1,"charlie":2},"nodes":[{"id":1,"scene":"drive","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Cholera!” — warczy Charlie, próbując jednocześnie złożyć niepraktycznie wielką mapę nad kierownicą twojego samochodu i nie wjechać przy tym w drzewo."},{"id":2,"scene":"drive","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Bzzz…” — mruczy Alex bez zastanowienia, otwierając i zamykając elektryczną szybę już dziesiąty raz w ciągu dwóch minut. Zaciskasz zęby. Dopiero wróciliście na drogę po przerwie na postoju dla tirów, a Alex zdążyła już pomajstrować przy każdym przycisku w zasięgu ręki. Tobie zostaje prowadzenie i n…"},{"id":3,"scene":"drive","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Wyciągasz rękę i przekręcasz gałkę. Głośniki wymiotują szumem, kiedy szukasz jakiegoś sygnału."},{"id":4,"scene":"drive","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Charlie wydaje się poirytowany. Siedzicie w samochodzie od ponad trzech godzin, więc to zrozumiałe. Wyciągasz rękę, kładziesz dłoń na jego nodze i ściskasz. Widzisz, jak w odpowiedzi lekko się uśmiecha."},{"id":5,"scene":"arrival","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Po kilku minutach, kilku kolejnych zakrętach i kilku milach w głąb lasu słońce zachodzi. Reflektory samochodu wykrawają w ciemności zaledwie kilka metrów drogi naraz. W końcu światła przesuwają się po froncie chaty i odbijają w dwóch oknach po obu stronach drzwi, które odpowiadają ci złowieszczym s…"},{"id":6,"scene":"arrival","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Kiwasz głową. „No. Hamburgery?”"},{"id":7,"scene":"drive","end":false,"system":false,"trigger":null,"roll":true,"snippet":"„Zjechaliśmy z I-90, pamiętasz?” — mówisz."},{"id":8,"scene":"drive","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Charlie się dąsa. Te wakacje wychodzą dokładnie tak, jak się spodziewałaś. Charlie zawsze upiera się, że prowadzi, gubi się, a potem odmawia przyjęcia pomocy. Weekend zapowiada się koszmarnie."},{"id":9,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wymierzasz solidny cios, prosto w twarz potwora. W twarz, którą ukradło ukochanej osobie. Uderzenie rozcina to ciało, a ono odrywa się i znika w nicości. Sama istota jest zupełnie nietknięta. Bo jak w ogóle dałoby się ją zranić? To wybuchająca, mutująca bestia. Ale w tej jednej chwili, kiedy ją ude…"},{"id":10,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Nie. Nie! Rzucasz się w stronę skraju polany. Zdążysz, jeśli tylko starczy ci szybkości! Słyszysz zniekształcony głos ukochanej osoby, który cię przywołuje, ale nie odwracasz się. A potem słyszysz ciężkie, łomotliwe kroki, które zbliżają się szybko. Nie możesz się powstrzymać i na moment zerkasz za…"},{"id":11,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Chata nie jest duża — to jedno główne pomieszczenie z podwójnym łóżkiem, komodą i kątem urządzonym jako kuchnia. Nie ma mikrofalówki; piekarnik i kuchenka chodzą na gaz. Widzisz dwie pary drzwi: jedne prowadzą na tył chaty, drugie do małej łazienki. Doskonale wiesz, że będzie tam lodowato."},{"id":12,"scene":"arrival","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Nie bardzo” — mówisz."},{"id":13,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Rozpakowujesz składniki na hamburgery. W szufladzie znajdujesz zapałki, przytykasz zapaloną do palnika i przekręcasz pokrętło. Nic się nie dzieje."},{"id":14,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Ja ciebie też.” Odwracasz głowę w stronę Charliego i odwzajemniasz pocałunek. „A teraz zmykaj! Muszę dokończyć kolację.”"},{"id":15,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„No” — mówisz z bladym uśmiechem. „Będzie super. Wiem to.”"},{"id":16,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"W kącie kuchni stoi mały okrągły stolik. Siadasz przy nim i opierasz głowę na rękach. Zastanawiasz się, ile Mark — brat Charliego — dał za to miejsce i czy było warto, biorąc pod uwagę, że nigdy tu nie bywa. Zastanawiasz się też, czy chata naprawiła jego małżeństwo, tak jak ma pomóc tobie i Charlie…"},{"id":17,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Jak wysmażyć twojego burgera?”"},{"id":18,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Idziesz jutro ze mną na szlak?”"},{"id":19,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"„Dobra” — mówisz."},{"id":20,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wyciągasz kasety i przeglądasz je jedna po drugiej, przewracając oczami i teatralnie udając odruch wymiotny przy każdej okładce."},{"id":21,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Łapiesz jedną ręką torbę i idziesz do łazienki. „Zaraz wracam” — mówisz i wsuwasz się do środka. W łazience jest jeszcze zimniej. Stawiasz torbę na umywalce i mrugasz do swojego odbicia, które patrzy na ciebie z lustra obok."},{"id":22,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Kiedy film się zaczyna, ekran jest czarny. Słychać cichą muzykę, ale nie ma napisów początkowych. Potem obraz przeskakuje na rozmyte nagranie zrobione wyraźnie kamerą z ręki."},{"id":23,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Zrywasz się z łóżka, krzywiąc się od rozdzierającego uszy hałasu. Przekręcasz gałkę i gasisz telewizor."},{"id":24,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wzdychasz. „Nieważne. Ty zawsze wiesz najlepiej, prawda?”"},{"id":25,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"„Super, kocham jechać pięć godzin, żeby siedzieć i patrzeć w telewizor tak jak w domu.”"},{"id":26,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Kiedy przebierasz w kasetach, zauważasz coś z tyłu szafki. Sięgasz do środka i to wyciągasz. To puste pudełko po kasecie VHS. Cienkie jak papier. Ktoś nagryzmolił na nim tytuł czarnym markerem: „Kwiaty w strumieniu”."},{"id":27,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Przyjmuję.”"},{"id":28,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Padasz na łóżko i rozprostowujesz nogi. Charlie przewija kasetę, bierze pilota do magnetowidu i kładzie się obok ciebie."},{"id":29,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Zaciskasz dłonie na uszach z całej siły, ale szum jakoś i tak się przedziera. Charlie obok ciebie robi to samo. Jego usta się poruszają, ale nie rozpoznajesz słów."},{"id":30,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Kręcisz głową i bierzesz głęboki wdech. „Masz rację. To głupie. Zapomnijmy o… czymkolwiek to, kurwa, było.”"},{"id":31,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Charlie?” — pytasz w ciemność."},{"id":32,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Charlie, możesz przyjść do łóżka?”"},{"id":33,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Ta chata jest do bani. Wiercisz się na nierównym materacu, próbując ułożyć się wygodnie. Niedługo później dołącza do ciebie Charlie. Rama skrzypi, kiedy kładzie się na łóżku."},{"id":34,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Kiedy budzisz się rano, jesteś sama."},{"id":35,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Udaje ci się znaleźć trochę bekonu i jajek. Syczenie i pryskanie tłuszczu wypełniają kuchnię. Tutejsza ołowiana cisza działa niepokojąco. Kilka razy sięgasz, żeby włączyć radio, zanim przypominasz sobie, że bez prądu nie zadziała. Bezmyślnie trącasz jajka łopatką i powoli wodzisz wzrokiem po pomies…"},{"id":36,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Na zewnątrz powietrze jest świeże, słońce grzeje, a niebo pozostaje niemal bezchmurne. Napełniasz płuca zapachem wilgotnej ziemi i sosen. Robisz kilka kroków i spoglądasz w dół podjazdu. Droga wije się i znika w lesie. Drzewa rosną tu tak gęsto, że łatwiej byłoby usłyszeć nadjeżdżający samochód, ni…"},{"id":37,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Na zewnątrz powietrze jest świeże, słońce grzeje, a niebo pozostaje niemal bezchmurne. Napełniasz płuca zapachem wilgotnej ziemi i sosen. Robisz kilka kroków i spoglądasz w dół podjazdu. Droga wije się i znika w lesie. Drzewa rosną tu tak gęsto, że łatwiej byłoby usłyszeć nadjeżdżający samochód, ni…"},{"id":38,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Kucasz i zrywasz borówki z krzaka. Ich miąższ łatwo się rozpada. Sok wycieka i barwi twoje palce na fioletowo. Już masz je oblizać, kiedy ogarniają cię wątpliwości. Borówki można bezpiecznie jeść, prawda? Głupio byłoby przypadkiem się zatruć podczas pierwszego wyjścia z chaty."},{"id":39,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Otaczająca cię przyroda powoli ściera warstwy stresu nagromadzone w całym twoim ciele. Po raz pierwszy od wielu tygodni uśmiechasz się szczerze. Nie musisz się nawet starać. To przyjemne uczucie. Zamykasz oczy i zwracasz twarz ku niebu. Świeże powietrze i promienie słońca muskają twoją skórę. Jest …"},{"id":40,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Idąc, czujesz delikatne trzepotanie w piersi. Myślisz o poprzednim dniu, o długiej jeździe i swoim związku. Potem przypominasz sobie wyjący szum telewizora."},{"id":41,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Przez kilka minut kręcisz się przed chatą, chodząc tam i z powrotem. Sprawdzasz zegarek. Ani śladu Charliego. Tylko słońce wznosi się coraz wyżej, a świat na zewnątrz ogrzewa się w jego promieniach."},{"id":42,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Nietypowy kształt przyciąga twój wzrok, więc zerkasz ponownie. Między stosem drewna a ścianą chaty leży duża siekiera."},{"id":43,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Nie możesz się skupić. Wciąż zerkasz na podjazd, ale nadal jest pusty. Kiedy nuda staje się nie do zniesienia, postanawiasz ruszyć na spacer w pojedynkę."},{"id":44,"scene":"stream","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Schodzisz ze szlaku i ruszasz przez las w stronę szumu płynącej wody. Grunt jest nierówny, więc po drodze podpierasz się o pnie pobliskich sosen."},{"id":45,"scene":"stream","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Ostrożnie schodzisz na brzeg strumienia. Luźne liście i sosnowe igły spływają z nurtem niczym miniaturowy spływ po rwącej rzece."},{"id":46,"scene":"stream","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Za strumieniem, między drzewami, słyszysz trzask łamanych gałązek. Sztywniejesz, a potem prostujesz się."},{"id":47,"scene":"stream","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Oglądasz dość filmów przyrodniczych, żeby wiedzieć, że cokolwiek trawi oko jelenia, nie jest czymś powszechnym. Nie przypomina żadnej z przerażających chorób ani żadnego z prionów czy pasożytów, które zdarzyło ci się widzieć w telewizji."},{"id":48,"scene":"stream","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wzdrygasz się. Przypomina ci się napis czarnym markerem na kasecie, która leciała tuż przed awarią telewizora: „Kwiaty w strumieniu”. Kiedy patrzysz na ten strumień, kwiaty na jego brzegu i liście niesione nurtem, w uszach rozbrzmiewa ci wspomnienie piskliwego szumu."},{"id":49,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Czas iść dalej. Skupiasz myśli i zdecydowanie ruszasz szlakiem, dalej przez Black Hills i głębiej w las. Wędrówka jest przyjemna. W chłodnym porannym powietrzu światło sączy się przez sosnowe gałęzie i rzuca wokół ciebie tańczące cienie."},{"id":50,"scene":"stream","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Ostrożnie schodzisz na brzeg strumienia. Luźne liście i sosnowe igły spływają z nurtem niczym miniaturowy spływ po rwącej rzece. Podpierając się o drzewo, siadasz na brzegu, odchylasz się do tyłu i zamykasz oczy. Wiatr muska twoją twarz i włosy. Podziwiasz, jak światło słońca maluje wnętrze twoich …"},{"id":51,"scene":"stream","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Bierzesz głęboki wdech i uśmiechasz się. Jest tu tak przyjemnie. Jednocześnie czujesz chłód i ciepło. Samotność działa na ciebie zaskakująco pokrzepiająco."},{"id":52,"scene":"stream","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Prostujesz się i przykładasz dłonie do ust. „Halo?”"},{"id":53,"scene":"stream","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Dzikie jelenie muszą borykać się z najróżniejszymi problemami zdrowotnymi. Nie masz pojęcia, co dolega temu stworzeniu. To może być jedna z tysiąca rzeczy. Tak czy inaczej, twoja obecność nie wydaje się mu szczególnie przeszkadzać. Kiedy tak stoisz i się gapisz, jeleń nagle odwraca się i rzuca do l…"},{"id":54,"scene":"stream","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Brniesz w stronę jelenia, żeby lepiej przyjrzeć się jego oku."},{"id":55,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wracasz na szlak i ruszasz naprzód, dalej przez Black Hills i głębiej w las."},{"id":56,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Przechodzisz przez niewielką polanę. Szopa stoi tam przekrzywiona, oparta o skaliste, porośnięte mchem zbocze."},{"id":57,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Jedyne światło w szopie wpada przez otwarte drzwi i kilka szczelin w nierównych ścianach z desek. Nie ma okien. Jakby to miejsce zaprojektowano specjalnie po to, żeby było ponure."},{"id":58,"scene":"shed","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Szafka wisi niepewnie na zrujnowanej ścianie. Niepokojąco przechyla się do przodu pod wpływem grawitacji. Widzisz kilka zardzewiałych gwoździ, które trzymają ją na miejscu."},{"id":59,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"W rzędzie kaset zauważasz wolne miejsce — jednej brakuje. Wyciągasz rękę i bierzesz kasetę obok. Jest trochę mniej zniszczona od pozostałych. Może jeszcze działa. Tytuł napisany czarnym markerem brzmi: „Wieczorna cisza”."},{"id":60,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wszystkie kasety mają dziwne tytuły, nabazgrane tym samym charakterem pisma. Zauważasz kilka: „Słońce pośród drzew”, „W nadziei, że wybuchnie”, „Sposób, w jaki porusza się nocą” i „Płacz dzieci”."},{"id":61,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Stoisz kilka minut przy otwartych drzwiczkach szafki, wpatrując się w kasety w środku."},{"id":62,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Stół roboczy jest zastawiony narzędziami. Żadne nie było ruszane od lat. Pokrywa je tłusty kurz. Widzisz matowoszary młotek. Może się przydać? Jest też coś, co wygląda na specjalistyczny zestaw miniaturowych śrubokrętów."},{"id":63,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Młotek jest zardzewiały, a skórzana rękojeść się kruszy, ale wciąż jest ciężki. Tylko to się liczy, prawda?"},{"id":64,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Bierzesz etui i je otwierasz. W środku jest pełno malutkich śrubokrętów. Ich końcówki mają dziwaczne, osobliwe kształty. W głowie aż ci wiruje. Do jakiego cudownego, sekretnego celu służą te narzędzia? Przy działaniu jakiego maleńkiego urządzenia pomagały? Na jaką dziwną tajemnicę natrafiasz? Myśli…"},{"id":65,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Pudła są mokre i pokryte grubą warstwą pleśni. Otwierasz klapy na wierzchu najwyższego pudła. Mdlący zapach zgnilizny uderza cię w nozdrza, gdy tylko go dotykasz. W środku leży sterta czarnych ubrań."},{"id":66,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Odkładasz najwyższe pudło na bok i otwierasz następne. To było lepiej chronione przed pogodą."},{"id":67,"scene":"shed","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Mrugasz, patrząc na kamerę. Przez moment uszy wypełnia ci wysoki skowyt trzeszczącego szumu. Ten sam dźwięk, który rozległ się zeszłej nocy."},{"id":68,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Podnosisz jeden ze słoików. Każdy zawiera gęstą, czarną substancję. Natychmiast uderza cię przytłaczający smród moczu."},{"id":69,"scene":"shed","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Sztylet jest większy, niż początkowo wyglądał. Ostrze ma mniej więcej długość twojego przedramienia. Zsuwasz skórzaną pochwę i patrzysz na lśniącą stal. W ponurym półmroku widzisz swoje odbicie, wpatrzone w ciebie."},{"id":70,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Toporne, ręczne urządzenie nagrywające przyprawia cię o dreszcz. Czy to właśnie tym nakręcono wideo, które oglądałaś zeszłej nocy?"},{"id":71,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wciskasz wszystkie przyciski w kamerze, ale nic się nie dzieje. Bateria prawie na pewno padła. Czujesz, jak coś grzechocze w środku, pewnie kolejna kaseta. Przycisk wysuwania jest jednak zablokowany."},{"id":72,"scene":"shed","end":false,"system":false,"trigger":null,"roll":true,"snippet":"A więc do tego są śrubokręty! Wracasz do szafki, bierzesz zestaw śrubokrętów i odwracasz kamerę. Próbujesz ją rozkręcić, żeby wyjąć kasetę."},{"id":73,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Manipulujesz przez chwilę malutkimi śrubokrętami. Po kilku nieudanych próbach słyszysz kliknięcie. Hura! Przycisk wysuwania wskakuje z powrotem na miejsce. Naciskasz go, a małe analogowe mechanizmy w środku zwalniają kasetę."},{"id":74,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Kamera uparcie opiera się twoim próbom jej otwarcia. Może w liceum warto było bardziej przyłożyć się do zajęć z majsterkowania albo elektroniki."},{"id":75,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Przez chwilę bawisz się zestawem śrubokrętów, ale nic z tego nie wychodzi. Nie możesz złapać śrub, a ręka ciągle ci się ślizga. W końcu ogarnia cię frustracja. Wbijasz śrubokręt w zablokowany przycisk z całej siły."},{"id":76,"scene":"shed","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Czekaj… W tym nie ma żadnej tajemnicy. Te narzędzia pewnie są do kamery."},{"id":77,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Rozcierasz resztki jagód między palcami i marszczysz brwi. Może lepiej zaczekać, aż Charlie wróci z samochodem, zanim wystawisz na próbę swoje umiejętności zbieractwa."},{"id":78,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Dość tego. Wychodzisz z małej szopy z powrotem do lasu. Mrużysz oczy w ostrym świetle słońca i dajesz im się przyzwyczaić."},{"id":79,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Daj spokój. Oglądasz dość horrorów, żeby trzymać się z daleka od małych, opuszczonych szop stojących pośrodku lasu."},{"id":80,"scene":"shed","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Tam jest ciemno. Naprawdę ciemno. Gdyby Charlie tu był, na pewno śmiałby się z ciebie, że trochę boisz się ciemności. No i co z tego? Co w tym złego? Czasem boisz się ciemności… No i ta mała szopa jest… ciemna, więc nie chcesz wchodzić do środka. Czy to takie złe?"},{"id":81,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Przez chwilę rozważasz wejście do szopy, ale na myśl o uwięzieniu w ciasnej, ciemnej szopie przechodzi cię lekki dreszcz."},{"id":82,"scene":"shed","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Zbierasz się w sobie i spoglądasz stanowczo na złowrogą szopę. No i co z tego? W środku jest ciemno, ale na zewnątrz jasno jak cholera, a szopa jest tak mała, że od drzwi zawsze dzielą cię najwyżej dwa kroki."},{"id":83,"scene":"drive","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Proszę cię.” Wyciągasz rękę i wyłączasz radio. „Nie mogę myśleć w tym hałasie.”"},{"id":84,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Docierasz na szczyt wzniesienia prowadzącego z powrotem do chaty. Słońce stoi wysoko na niebie. Jest późny ranek, zbliża się popołudnie."},{"id":85,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Kiedy docierasz z powrotem do chaty, brakuje ci tchu. Słońce stoi wysoko na niebie. Jest późny ranek, zbliża się popołudnie. Dyszysz, nogi ci pulsują, a po biegu pod górę jest ci gorąco."},{"id":86,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Zamykasz za sobą drzwi i odkręcasz wodę pod prysznicem. Woda kaskadą spływa do wanny, wypełniając pomieszczenie jednostajnym, głośnym pluskiem, który niemal przypomina biały szum. Bez prądu zasilającego pompę ciśnienie jest marne, ale większość roboty wykonuje grawitacja. Dzięki Bogu podgrzewacz wo…"},{"id":87,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Woda kaskadą spływa do wanny, wypełniając pomieszczenie jednostajnym, głośnym pluskiem, który niemal przypomina biały szum. Bez prądu zasilającego pompę ciśnienie jest marne, ale większość roboty wykonuje grawitacja. Dzięki Bogu podgrzewacz wody jest na gaz."},{"id":88,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wciąż czujesz ciepło po prysznicu, ale przechodzi cię lekki dreszcz. Tłumisz niepokój. Drzwi pewnie same się otworzyły. Wygląda na to, że w tej chacie wszystko jest trochę wadliwe."},{"id":89,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Czy ktoś tu był? Okna są zamknięte. Czy tracisz rozum? Przecież drzwi były zamknięte — doskonale to pamiętasz."},{"id":90,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Woda jest ciepła, oczyszczająca i kojąca. Uwielbiasz, kiedy spływa po twojej skórze. Przysięgasz, że pachnie nawet inaczej niż woda w mieście."},{"id":91,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Przeciągasz się i wykonujesz głową kilka okrężnych ruchów, żeby rozruszać zmęczone mięśnie, a potem podchodzisz do łóżka i otwierasz walizkę. Ściągasz usta i zastanawiasz się, jak się czujesz."},{"id":92,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wychodzisz spod prysznica i się wycierasz. Wracasz do głównego pomieszczenia chaty i postanawiasz się ubrać."},{"id":93,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Po przebraniu czujesz przypływ nowych sił."},{"id":94,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Idziesz do aneksu kuchennego. Cieszysz się, że lodówka i kuchenka chodzą na gaz."},{"id":95,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Wiesz, że w samochodzie jest porządna latarka, ale teraz nie masz do niej dostępu. Co da się znaleźć tutaj, w chacie? Po zachodzie słońca czeka cię ciemność."},{"id":96,"scene":"drive","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Ignorujesz jednostajny dźwięk radia i starasz się skupić na prowadzeniu. Alex poprawia się na siedzeniu. Wierci się, czyta na głos mijane znaki i zagaduje o drobiazgi. Pamiętasz, żeby na każde pytanie odpowiedzieć czymś więcej niż jednym słowem. Pamiętasz też słowa doktora O'Briena: dobra komunikac…"},{"id":97,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"W szafce pod zlewem znajdujesz mały plastikowy pojemnik, a w nim niewielką latarkę. Włączasz ją. Działa, ale promień jest słaby. Baterie są już pewnie na wyczerpaniu."},{"id":98,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"W szafce pod zlewem znajdujesz mały plastikowy pojemnik, a w nim niewielką latarkę. Włączasz ją. Działa, ale promień jest słaby. Baterie chyba już padły."},{"id":99,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"W szafce pod zlewem znajdujesz mały plastikowy pojemnik, a w nim niewielką latarkę. Włączasz ją. Działa, ale promień jest słaby. Baterie chyba już padły."},{"id":100,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Nie reagujesz dość szybko. Poszarpany kawałek drewna opada pod ciężarem materaca i wbija ci się w bok. Wysuwasz się spod łóżka, rozcinając skórę na boku i zostawiając długie, poszarpane zadrapanie."},{"id":101,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Ta poszarpana listwa naprawdę boli. Krzywiąc się i przygryzając wargę, wyczołgujesz się spod łóżka. „Cholera!” — przeklinasz i wstajesz, przyciskając dłoń do rany w boku."},{"id":102,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Po kilku minutach burczy ci w brzuchu. Czujesz, jak coś paskudnego bulgocze w twoich trzewiach."},{"id":103,"scene":"arrival","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Słońce stopniowo zachodzi. Reflektory twojego samochodu wykrawają w ciemności zaledwie kilka metrów drogi naraz. Wreszcie przesuwają się po froncie chaty i odbijają w dwóch oknach po obu stronach drzwi, które patrzą na ciebie jak czujne oczy. Podjeżdżasz i parkujesz."},{"id":104,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Co złego może ci zrobić kilka borówek? Poza tym masz co najmniej dziewięćdziesiąt procent pewności, że rozpoznajesz ich gatunek. Oblizujesz resztki soku z palców i wrzucasz do ust jeszcze jedną garść. Zanim odejdziesz, zrywasz ostatnią porcję i wypełniasz nią kieszenie."},{"id":105,"scene":"arrival","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„No proszę cię. Burgery?”"},{"id":106,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Pychota. Naprawdę. Gotujesz na poziomie Michelin."},{"id":107,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Las jest odludny, ciemny i głęboki. Siedzisz tu sama, w chacie bez prądu, i wmawiasz sobie, że wszystko będzie dobrze. Dopóki słońce pozostaje na niebie, udaje ci się podtrzymywać to złudzenie. Ale z każdą mijającą minutą widzisz, jak słońce zbliża się do horyzontu, pędząc, by zostawić cię w ciemno…"},{"id":108,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Nie przychodzi ci do głowy nic więcej do roboty w chacie i zaczyna cię nosić. Przez jakiś czas leżysz na kanapie i czytasz starą, sfatygowaną książkę w miękkiej oprawie, zdjętą z półki w kącie. Wydaje ci się całkiem dobra, choć trochę zbyt kwiecista i przegadana — nie wspominając już o tym, jak iry…"},{"id":109,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Przekręcasz się na drugi bok. Pęknięta listwa stelaża wbija się w podłogę chaty i grzęźnie w drewnie. Gdyby cię trafiła, mogłaby naprawdę zrobić ci krzywdę. Z adrenaliną dudniącą w żyłach wysuwasz się spod łóżka, ciężko dysząc."},{"id":110,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Słyszysz kroki na zewnątrz. Chrzęszczą na żwirowym podjeździe. Prostujesz się. Nie słyszysz, żeby podjeżdżał samochód. Nerwowo wstajesz i podkradasz się do okna."},{"id":111,"scene":"arrival","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Nie bardzo.”"},{"id":112,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Przyroda jest naprawdę hałaśliwa. Nie możesz skupić się na książce. Nagle przypominasz sobie o przenośnym odtwarzaczu, który masz ze sobą. Wstajesz i przeszukujesz walizkę, aż go znajdujesz, a potem wracasz na kanapę."},{"id":113,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Ktoś puka do drzwi. Gwałtownie siadasz. Nie słyszysz żadnego samochodu."},{"id":114,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"„Przepraszam, kim pan jest?” — pytasz. Ignoruje twoje pytanie."},{"id":115,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Zerkasz za nieznajomego na polanę — tę, na której stał wasz samochód i z której droga prowadzi do głównej szosy. Jest pusta. Ten facet musiał przyjść do chaty pieszo."},{"id":116,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Mieszka pan gdzieś w pobliżu?” — pytasz. Kręci głową. „Ma pan jakiś problem z samochodem czy coś?” Znowu kręci głową."},{"id":117,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Ten nieznajomy przyprawia cię o dreszcze. Stoi niepokojąco blisko drzwi, w jakiejś dziwnej pozie. „Przepraszam, musi pan wyjść” — mówisz."},{"id":118,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Nie wiesz, co dalej powiedzieć. „Czy się pan zgubił?” — pytasz."},{"id":119,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Czujesz żwir w trzewiach. Stajesz do niego twarzą w twarz."},{"id":120,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Musisz upewnić się, że chata jest bezpieczna. Sprawdzasz wszystkie zamki, jakie tylko znajdujesz. Domykasz drzwi, przekręcasz klucz i zasuwasz rygiel, żeby mieć absolutną pewność. Potem idziesz do łazienki i sprawdzasz okno. Je też zamykasz na zatrzask."},{"id":121,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Podchodzisz do drzwi, odsuwasz rygiel i je otwierasz. „Halo?”"},{"id":122,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Julie tu nie ma. My tylko zatrzymaliśmy się w tej chacie.”"},{"id":123,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Nie, Marka też tu nie ma.”"},{"id":124,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Nie ma sensu się zadręczać. Jesteś tu z jakiegoś powodu. Kochasz Alex. Chcesz, żeby się udało. Możesz cały dzień snuć przypuszczenia, jak się to skończy, ale niczego to nie zmieni. Wszystko, co możesz zrobić, to być najczulszą i najbardziej kochającą osobą, na jaką cię stać. To, czy wystarczy, nie …"},{"id":125,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Proszę pana” — mówisz z uśmiechem. „Nie próbuję być agresywna. Jestem po bardzo długim spacerze i padam ze zmęczenia. Obawiam się, że właśnie przerywa mi pan drzemkę. Jeśli nic więcej nie mogę dla pana zrobić, nie ma pan nic przeciwko, żebym wróciła spać? Następnym razem, kiedy będę rozmawiać z Ma…"},{"id":126,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Ta chata jest beznadziejna. Mark zawsze tak się nią ekscytuje, ale tak naprawdę to niezła ruina. Może wydaje się przyjemniejsza, gdy przyjeżdżasz tu z kimś, kogo kochasz. Od miesięcy nie jesteście z Alex blisko. To tylko kolejna nieudana próba pojednania, którą możesz dorzucić do kolekcji. Przynajm…"},{"id":127,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Alex czuje się zagubiona. Tylko wtedy milknie. Patrzysz, jak bez przekonania skubie jedzenie. Pewnie roztrząsa to wszystko w głowie, tak jak ty. Choć masz ochotę wyrzucić z siebie pytania i wszystko przegadać, zmuszasz się do milczenia. Alex nie lubi takich bezpośrednich rozmów. Jeśli zaczniesz pyt…"},{"id":128,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„No dooobra” — mówisz powoli, mrużąc oczy. „Dzięki.”"},{"id":129,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Alex wciąż unika twojego wzroku. Nie sposób odgadnąć, co się dzieje w jej głowie, skoro nie chce porozmawiać ani nawet spojrzeć ci w oczy. Tylko bez przekonania skubie jedzenie i nic nie mówi. Może najlepiej powiedzieć wprost. „Jak się czujesz?” — pytasz."},{"id":130,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Starasz się brzmieć stanowczo, ale głos ci drży."},{"id":131,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Kiedy przebierasz w kasetach, zauważasz coś z tyłu szafki. Sięgasz do środka i to wyciągasz. To puste pudełko po kasecie VHS. Jest cienkie i tandetne. Ktoś nagryzmolił na nim tytuł czarnym markerem: „Kwiaty w strumieniu”."},{"id":132,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Skąd zna pan Marka i Julie?”"},{"id":133,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wyciągasz kasety i przeglądasz je jedna po drugiej, przewracając oczami i teatralnie udając odruch wymiotny przy każdej okładce."},{"id":134,"scene":"cabin","end":true,"system":false,"trigger":null,"roll":false,"snippet":"„Nie!” Po raz ostatni wymierzasz cios istocie. Tym razem nie trafiasz. Wijące się macki wystrzeliwują i chwytają cię za oba nadgarstki. Szarpiesz się w ich uścisku. Trzecia macka unosi się przed tobą. Jej końcówka jest ostra. Za nią majaczy prawdziwa postać potwora: kłębowisko nieopisanych, wijącyc…"},{"id":135,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Uśmiechasz się do Alex i odpowiadasz: „Ja ciebie też kocham.” Potem oboje przez chwilę milczycie i cieszycie się ciszą. Następnie żwawo podchodzisz do magnetowidu i wszystko przygotowujesz. Po chwili leżycie już w łóżku przed telewizorem, a zatrzymana na początku kaseta jest gotowa do odtworzenia."},{"id":136,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"„Byłoby… po prostu super, gdyby pan sobie stąd poszedł” — mówisz. „Mówię poważnie.”"},{"id":137,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Tylko umyję zęby przed filmem” — mruczysz. Udajesz, że słowa Alex w ogóle do ciebie nie docierają. Ona raczej tego nie kupuje. Kiedy człapiesz z torbą w stronę łazienki, dostrzegasz w jej oczach cień bólu. Czujesz się z tym źle, ale nie potrafisz skłamać jej prosto w twarz. Spychasz poczucie winy …"},{"id":138,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wychodzisz z chaty i patrzysz, jak nieznajomy maszeruje ścieżką spacerową. Ruszasz za nim, chrzęszcząc po tych samych kamieniach co podczas porannego spaceru."},{"id":139,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Długo leżysz na kanapie. Co chwilę zapadasz w sen i się budzisz. Próbujesz jeszcze trochę poczytać, ale książka cię nudzi."},{"id":140,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Czekasz kilka chwil, a potem słyszysz, jak nieznajomy odsuwa się od drzwi."},{"id":141,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Spieszysz za nieznajomym. Idziesz jego śladem przez las. Jesteś niedaleko za nim, ale mężczyzna zdaje się nie zwracać na ciebie uwagi."},{"id":142,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Jest ciemno. Chmury zasłaniają niebo i skrywają księżyc."},{"id":143,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Idziesz za nieznajomym, nie próbując się ukrywać. Wiesz, że musi cię słyszeć, ale nie zatrzymuje się ani nie spogląda w twoją stronę. Facet ruszył wcześniej i szybko chodzi. Musisz się spieszyć, żeby dotrzymać mu kroku."},{"id":144,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Pochylasz się i stawiasz ostrożnie kroki, omijając patyki i gałęzie, żeby stłumić odgłosy pościgu. Mężczyzna nieco się oddala, ale nie tracisz go z oczu."},{"id":145,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Kiedy film się zaczyna, ekran jest czarny. Słychać cichą muzykę, ale nie ma napisów początkowych. Potem obraz przeskakuje na rozmyte nagranie zrobione wyraźnie kamerą z ręki."},{"id":146,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Skradasz się za nieznajomym. Patyki pękają, a liście chrzęszczą pod twoimi stopami. W cichym lesie robią niewiarygodny hałas. Wyjątkowo głośny trzask sprawia, że odruchowo przeklinasz. Ups. Zakrywasz usta dłonią, ale jest już za późno. Mężczyzna, którego śledzisz, odwraca się i rozgląda. Wasze spoj…"},{"id":147,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Robisz wszystko, żeby zachować ciszę. Omijasz duże patyki i trzymasz się nisko przy ziemi. Wtedy uderzasz o coś palcem stopy, przeklinasz z bólu i upadasz na kolana, krzywiąc się."},{"id":148,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Odwracasz się gwałtownie i pędzisz z powrotem do chaty tak szybko, jak potrafisz. Łapiesz krótkie hausty powietrza. Płuca ci płoną."},{"id":149,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Udaje ci się zrobić zaledwie kilka kroków, zanim cię dopada."},{"id":150,"scene":"forest","end":true,"system":false,"trigger":null,"roll":false,"snippet":"Miotasz się i szarpiesz, ale bez skutku."},{"id":151,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wyrywasz się z uścisku nieznajomego, zrywasz się na nogi i zataczasz dalej. Pędzisz ku bezpiecznemu schronieniu tak szybko, jak potrafisz. Płuca ci płoną, gdy łapiesz urywane hausty powietrza. Przez łomot krwi w uszach niczego nie słyszysz."},{"id":152,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Oboje stoicie w miejscu, skuci bezruchem lasu. Martwe, puste oczy nieznajomego nie zdradzają żadnych emocji."},{"id":153,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Nie odrywasz od niego wzroku. Krzyżujesz ramiona na piersi. Nie zamierzasz dać temu facetowi satysfakcji i ustąpić."},{"id":154,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Zaciskasz dłonie na uszach z całej siły, ale szum jakoś i tak się przedziera. Alex obok ciebie robi to samo. Jej usta się poruszają, ale nie rozpoznajesz słów."},{"id":155,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Noc robi się coraz ciemniejsza."},{"id":156,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Dalsze śledzenie tego dziwaka w głąb lasu jest zbyt niebezpieczne. Odwracasz się i próbujesz znaleźć drogę powrotną do chaty."},{"id":157,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Trwa to dłużej, niż oczekujesz, ale w końcu odnajdujesz ścieżkę spacerową, a potem wracasz do chaty Marka. Zanim tam docierasz, słońce niemal całkiem zachodzi."},{"id":158,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Zrywasz się z łóżka, krzywiąc się od rozdzierającego uszy hałasu. Przekręcasz gałkę i gasisz telewizor."},{"id":159,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Jest ciemno i robi się coraz ciemniej. Wokół widzisz tylko kamienie, skały i drzewa. Robi się też coraz zimniej. Zęby ci szczękają, a ten dźwięk daje odrobinę marnego pocieszenia, kiedy drżysz. Mięśnie, o których istnieniu nie masz pojęcia, napinają się i pulsują w rozpaczliwej próbie utrzymania ci…"},{"id":160,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wzdychasz. „Nieważne. Ty zawsze wiesz najlepiej, prawda?”"},{"id":161,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Trwa to wieczność, a zimno przenika do szpiku kości, ale w końcu udaje ci się wrócić na ścieżkę, a stamtąd do chaty."},{"id":162,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Wszystko wygląda tak samo. Idziesz godzinę, może nawet dłużej. Nie wiesz, ile czasu mija, ale zdaje się, że całe wieki. Ogarnia cię zimno. Kąsa. Zęby ci szczękają, a ty potykasz się naprzód, nie mogąc opanować dygotania."},{"id":163,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Postanawiasz się wycofać, póki jeszcze możesz."},{"id":164,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Idziesz dalej za nim. Słońce zachodzi i robi się ciemno. W końcu nieznajomy wchodzi na małą polanę. Pośrodku znajduje się kopiec świeżo rozkopanej ziemi."},{"id":165,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"„Przepraszam” — mówisz, wychodząc spomiędzy drzew. „Przepraszam. Już idę, dobrze? Odejdę.”"},{"id":166,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Przyciskasz dłonie do uszu. Twój krzyk dołącza do zawodzenia szumu."},{"id":167,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Nie. Nie! Chwiejnym krokiem cofasz się, chwytasz za głowę i pędzisz ku skrajowi lasu. U podstawy czaszki rozkwita straszliwy, ostry ból. Obraz ci się rozmazuje. Docierasz do drzew i na ślepo zataczasz się w las."},{"id":168,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wciąż ściskając głowę dłońmi, biegniesz tak szybko, jak tylko potrafisz, ku bezpieczeństwu. Czujesz krew wyciekającą z uszu i zbierającą się w dłoniach. Pędzisz między drzewami, przeskakujesz przez kłody i schylasz się pod gałęziami."},{"id":169,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Wciąż ściskając głowę dłońmi, biegniesz tak szybko, jak tylko potrafisz, ku bezpieczeństwu. Czujesz krew wyciekającą z uszu i zbierającą się w dłoniach."},{"id":170,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wpadasz do chaty i trzaskasz drzwiami. Gdy upewniasz się, że są zamknięte, osuwasz się po ścianie i siadasz, kryjąc głowę w dłoniach. Trzęsiesz się. To było okropne. Zupełnie, niewypowiedzianie okropne. I co teraz? Co ty, do diabła, masz robić?"},{"id":171,"scene":"forest","end":true,"system":false,"trigger":null,"roll":false,"snippet":"Mózg robi ci zwarcie. Ogarniająca cię panika znika w jednej chwili. To jest to. Tu jest moje miejsce."},{"id":172,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"„O czym pan mówi?” — pytasz. Kręcisz głową na boki, ogarniając wzrokiem widok przed sobą. „Co to za miejsce?”"},{"id":173,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Przyciskasz dłonie do uszu. Krzywisz się. Czujesz szum w głowie. Z wnętrza uszu kapie krew, zbierając się w zagłębieniach dłoni."},{"id":174,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Kręcisz głową i bierzesz głęboki oddech. „Masz rację. To głupie. Po prostu zapomnijmy o… czymkolwiek to, do diabła, było.”"},{"id":175,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Dłoń zsuwa ci się z ucha na krótką chwilę. W tym momencie szum nasila się dziesięciokrotnie. Czujesz, jak dźwięk drąży ci głowę, jak lodowate palce, które szarpią mózg i drapią wnętrze czaszki."},{"id":176,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Odkładasz kanapkę i przełykasz. Idziesz do drzwi, kierując się światłem latarki."},{"id":177,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Przez moment stoisz w otwartych drzwiach, wychylając się z chaty. Widzisz niedaleko stos drewna opałowego oraz znalezioną wcześniej siekierę, opartą o drzwi chaty."},{"id":178,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Jest zimno, wiatr przybiera na sile, a tu na zewnątrz jest głośniej, niż ci się wydawało. Nie umiesz rozróżnić pojedynczych dźwięków; słyszysz tylko jedno długie wycie."},{"id":179,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Szum. Szum. Wyjący szum. W drzewach i na ziemi. Na twarzy i w gardle. W trzewiach i w oczach. Wyje, wyje, wyje. Siateczkowy, biały, wyjący SZUM. W pośpiechu wracasz do środka."},{"id":180,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Nieprzyjemnie. Zimno. Nie widzisz nic więcej."},{"id":181,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Zamykasz drzwi. Dopiero gdy wraca lekkie ciepło chaty, zdajesz sobie sprawę, jak zimno jest na zewnątrz."},{"id":182,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Zamykasz drzwi i upewniasz się, że są zamknięte na klucz. Nawet napierasz na nie, żeby sprawdzić, czy nie ustąpią. Ani drgną. Czując się bezpieczniej, wracasz na środek pomieszczenia. Czekasz. Czas płynie. Noc się przeciąga. W chacie robi się coraz zimniej."},{"id":183,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Kończysz kanapkę i wkładasz talerz do zlewu. Nikt więcej nie puka do drzwi. Masz rację. To pewnie tylko jakiś przedmiot rzucony przez wiatr o chatę."},{"id":184,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Sięgasz do lampki nocnej i pstrykasz włącznikiem. Nic."},{"id":185,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Spieszysz do telewizora. Wciskasz przycisk zasilania."},{"id":186,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Jest cicho. Magnetowid mruczy. Telewizor świeci słabo."},{"id":187,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wyjmujesz kasetę znalezioną w zrujnowanej szopie. Tytuł zapisany czarnym markerem na etykiecie brzmi: „Wieczorna cisza”."},{"id":188,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wkładasz kasetę i wciskasz przycisk odtwarzania."},{"id":189,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Przewijasz kasetę, patrząc, jak obrazy przelatują przed tobą wstecz. Zatrzymujesz się w miejscu, w którym mężczyzna kieruje kamerę w stronę lasu. Podkręcasz głośność do maksimum."},{"id":190,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Wytężasz słuch. Odpowiedź jest cicha i pada wycieńczonym głosem. „To mnie zjada!”"},{"id":191,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Czujesz lodowaty supeł w żołądku. Z trudem przełykasz ślinę. Wysuwasz kasetę. Ledwo udaje ci się zachować panowanie nad sobą."},{"id":192,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Halo?” — woła kamerzysta."},{"id":193,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„Alex?” — pytasz w ciemność."},{"id":194,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Zjadanie. Coś zjada tego faceta. Co, do cholery, go zjada? Czy to jest gdzieś tam? Czy idzie po ciebie? O Boże. Dlaczego w ogóle zabranie kasety wydaje ci się dobrym pomysłem? Co ci chodzi po głowie?"},{"id":195,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Przewijasz kasetę do tego samego miejsca, przysuwasz ucho do głośnika i wciskasz odtwarzanie."},{"id":196,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Bierzesz kasetę, która zaklinowała się w kamerze, i przyglądasz się jej. Na boku widnieje napis: „Para, która przyjechała do chaty”."},{"id":197,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Kaseta rusza. Na ekranie widać drewnianą ścianę. Kamera przesuwa się po pomieszczeniu. Żołądek ci się zaciska, kiedy zdajesz sobie sprawę, że ekran pokazuje wnętrze chaty — tej, w której teraz jesteś."},{"id":198,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Ta kaseta jest… stara jak świat. Julie i Mark mają chatę od lat. Jeśli nagranie pochodzi z jednej z ich pierwszych wizyt, to skąd, do cholery, ktoś wiedział, że ma pytać o ciebie i Charliego?"},{"id":199,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Kto, do cholery, był tu i o was pytał? Czy nagranie powstało wiele lat temu? To nie ma żadnego sensu. Kaseta pochodzi z kamery Marka, więc czy szopa w lesie też należy do niego? Dlaczego nic o niej nie powiedział?"},{"id":200,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Przewijasz kasetę i próbujesz powstrzymać narastającą panikę, która grozi, że cię zaleje. Kiedy wciskasz „play”, Mark i Julie znów odgrywają swoją przesadną pantomimę. Wpatrujesz się w wydarzenia, wodząc wzrokiem po ekranie i rozpaczliwie szukając jakiejkolwiek wskazówki."},{"id":201,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wodzisz wzrokiem po pikselowatym nagraniu. Pochylasz się bliżej, badasz obraz, słuchasz i szukasz czegokolwiek, co może być tam ukryte."},{"id":202,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Kiedy wciskasz pauzę w chwili, gdy drzwi się otwierają, coś przykuwa twój wzrok. Cofasz kasetę o zaledwie kilka sekund."},{"id":203,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Oglądasz całą kasetę jeszcze raz. Nic. Przewijasz i oglądasz ponownie. Wciąż nic. Próbujesz dalej. Wizg przewijania staje się znajomy, kiedy oglądasz nagranie piąty, szósty, siódmy, ósmy raz…"},{"id":204,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"W porządku. Nie daj się przytłoczyć. Wszystko będzie dobrze. Nic się nie dzieje. Cokolwiek to jest, na pewno da się to wyjaśnić. Tak, to niepokojące, ale przecież spójrz, jak dziwnie i potwornie wygląda nawet odbicie Marka!"},{"id":205,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„To było naprawdę głośne” — mówisz. Słyszysz drżenie we własnym głosie. Alex wyraźnie też je słyszy."},{"id":206,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Chryste. Co to za rzecz?"},{"id":207,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Poprawiasz poduszkę uderzeniem, układasz na niej głowę i próbujesz znaleźć wygodną pozycję do snu. Alex wraca do łóżka, waha się, a potem się na nie wdrapuje."},{"id":208,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Kaseta z poprzedniej nocy wciąż leży w małej szafce. Może to chorobliwa ciekawość, a może po prostu chęć zrozumienia, co się dzieje — wyciągasz kasetę i wsuwasz ją do magnetowidu."},{"id":209,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Ignorujesz zakłócenia, zakładając, że obraz sam się wyreguluje."},{"id":210,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Przekręcasz gałkę głośności i zaczynasz wyraźnie słyszeć jego słowa."},{"id":211,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Teraz, kiedy znajduje się tak blisko, zauważasz coś dziwnego na jego twarzy. Wokół krawędzi powieki, niemal dokładnie wzdłuż linii rzęs, wyrasta mu rząd ropnych krost. Różnią się wielkością, ale wyglądają na bolesne, żółte i wilgotne."},{"id":212,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Do złudzenia przypomina to oko jelenia z wcześniejszego spotkania w lesie. Taka sama rana, taka sama… dziwna, odrażająca choroba. Przecież zakładasz, że to rodzaj choroby, którą zarażają się zwierzęta, nie ludzie."},{"id":213,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Cofasz kasetę. Zwiększasz głośność. Jest nieprzyjemnie głośno. Wciskasz „play”."},{"id":214,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wpychasz palce do uszu i łokciem uderzasz w przycisk stop magnetowidu."},{"id":215,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Mężczyzna unosi teczkę kartonową i uśmiecha się. „Wszystko tu jest, tak jak wczoraj. Wszystko, co zapisałem po tym pierwszym śnie.” Kładzie teczkę na kolanach, poza kadrem, i spuszcza wzrok. Słyszysz, jak ją otwiera, a kartki szeleszczą."},{"id":216,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Ten szum. Ten szum. Ten ohydny szum!"},{"id":217,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Mężczyzna podnosi wzrok i rozgląda się po sosnach na skraju polany. Wciąż mówi. Wstaje, a potem spogląda na ogień."},{"id":218,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Krosty przy oczach mężczyzny bardzo przypominają te u jelenia z lasu. Ten sam rodzaj bólu, ten sam rodzaj… dziwnej, przyprawiającej o mdłości choroby."},{"id":219,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Mężczyzna uśmiecha się, trzymając kartonową teczkę wyjętą z namiotu. Kładzie ją na kolanach, poza kadrem, i spuszcza wzrok. Coś mówi."},{"id":220,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Powoli cofasz się od telewizora. Coś jest nie tak. Coś jest bardzo nie tak."},{"id":221,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wypowiada twoje imię. Wypowiada imię Charliego. Hałas przedziera się, mimo że telewizor jest wyciszony. Ten obrzydliwy głos… Brzmi jak gardło wypełnione drutem kolczastym, białym szumem i trzaskami."},{"id":222,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Majstrujesz przy przyciskach regulacji obrazu, obserwując poszarpane srebrzyste linie przesuwające się w górę i znikające z ekranu. Odsłaniają zbliżenie twarzy mężczyzny. Nie patrzy w kamerę. Majstruje przy czymś pod nią."},{"id":223,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Odwracasz się od telewizora i podchodzisz do łóżka. Siadasz i starasz się na niego nie patrzeć. Słyszysz jego bardzo ciche brzęczenie."},{"id":224,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Podążasz za snopem światła latarki aż do drzwi chaty i je otwierasz."},{"id":225,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Słyszysz szybko zbliżające się kroki. Błyskawicznie robią się coraz głośniejsze. Odwracasz się i unosisz latarkę. Snop światła pada na cień mężczyzny biegnącego w twoją stronę ze skraju lasu. Oczy rozszerzają ci się, gdy go rozpoznajesz. Jest w średnim wieku, ma wielką kurtkę i twarz wykrzywioną za…"},{"id":226,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Stopy ślizgają ci się po drewnianym ganku, gdy rzucasz się ku drzwiom. Pędząca postać jest tuż za tobą. Czy zdążysz?"},{"id":227,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Wpadasz z powrotem do chaty i trzaskasz drzwiami, pośpiesznie je zamykając."},{"id":228,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Nie słyszysz nic. Nie widzisz nic. Charlie nie wraca. Oby utknął gdzieś po drodze i pojawił się w nocy. Mimo to nie możesz powstrzymać najgorszych obaw."},{"id":229,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"„To musi być tego warte” — mówisz. „Proszę. Proszę, Alex! Musi.” Twarz Alex pozostaje bez wyrazu. Potem kręci głową."},{"id":230,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Rzucasz się do chaty i próbujesz zamknąć drzwi. Są domknięte zaledwie do połowy, gdy on w nie uderza. Jego ramię klinuje się między drzwiami a framugą, nie pozwalając im się zamknąć. Uwięziona kończyna macha dziko, próbując cię dosięgnąć."},{"id":231,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You try to slam the door shut and get inside, but you're not fast enough."},{"id":232,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Your flashlight skitters out of your hands and slides across the cabin floor into the kitchen."},{"id":233,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":true,"snippet":"\"Hey!\" you call out. \"Stop right there!\""},{"id":234,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"\"Hey, do you want to watch a movie?\" you ask."},{"id":235,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You open the door just a little. The arm swipes violently; the elbow twists into a vulnerable position. When it does, you slam the door hard against it. There's a hideous crack. You hear the man howl in pain."},{"id":236,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You push away from the door and stumble back. You turn towards the main room of the cabin. In just a few seconds, you know you'll hear the door fling inward and smash hard against the interior wall."},{"id":237,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You dart to the kitchen and grab one of the chairs. You drag it to the door and wedge it under the knob. It holds everything in place as the stranger continues to screech and smash his way inside. You can feel the walls shake with every blow. You step back, praying that the door will hold."},{"id":238,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"The chair locks in place under the door. You see the wood flex and bulge with each strike. You haven't stopped your attacker, but you've slowed them down. You glance around the cabin again and frantically reassess your options."},{"id":239,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You run across the cabin, past the bed, and into the bathroom."},{"id":240,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You hear a crash and a ragged snarl as the stranger barges into the center of the cabin."},{"id":241,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You search around for something, anything, to defend yourself with."},{"id":242,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Alex hugs you back. \"I know you have. Don't worry. Everything is going to be okay now. We're all together now.\" You feel Alex's hands stroking at the back of your head. You pull away. You don't have time for this right now."},{"id":243,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You have a weapon! You hurry over to the pile of clothes you wore earlier on your jog, rummage through them, and draw out the long, beautiful dagger that you found in the shed this morning."},{"id":244,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You have a weapon! You hurry over to the pile of clothes you wore earlier on your jog, rummage through them, and draw out the moldy but still solid hammer that you found in the shed this morning."},{"id":245,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"There's got to be something here you can use. Your eyes snap between unpacked vegetables, abandoned video tapes, and neatly folded linen."},{"id":246,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"After just a single strike against the door, your chair slips sideways and clatters to the ground. It's not slowing anybody down. The door continues to splinter under a hail of blows. Your attacker will be inside any second."},{"id":247,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Instinct takes over. You sprint to the kitchen, open the drawers inside, feel around the silverware."},{"id":248,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"I need you, Charlie,\" Alex's voice says, but this time, it comes from behind you. You spin around and see that the man who crawled out of the tent, body unchanged, is now wearing Alex's face. There's two of them now. They're on either side of you."},{"id":249,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"The hammer is well-weighted in your hands. You slap it against your palm, walk forward, and make your stand just by the front door. After just a few seconds, it bursts open and the stranger steps inside. He charges right at you."},{"id":250,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"A memory of flesh splitting, giving way to monstrous black tentacles, leaps into your mind. You've already seen the Child. You know what's coming next. Before you, Alex's face bulges. Pine needles sprout from their cheeks and emerge, covered in blood. Their mouth opens and a thick fleshy tentacle l…"},{"id":251,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"How can there be nothing in this cabin you can use as a weapon? You dash back and forth but fail to lay your hands on anything remotely useful."},{"id":252,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You're out of time."},{"id":253,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You grip the hilt of the ornate dagger. It feels powerful. You feel powerful."},{"id":254,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You hear a ragged snarl as the stranger stalks into the center of the cabin."},{"id":255,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You crawl under the covers without bothering to get changed. At least here it is warm. You set the flashlight by the side of the bed and switch it off. Then, you curl up around your pillow, listening to the sound of the wind outside, and wait to fall asleep."},{"id":256,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"A thump at the cabin door startles you awake. You hadn't been asleep long."},{"id":257,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"Who's there?\" you cry."},{"id":258,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You wake."},{"id":259,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"The stranger is bigger than you. He is crazed, wild, and violent."},{"id":260,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You lash out at the stranger."},{"id":261,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"The stranger is deranged and dangerous, but you're strong, skillful, lucky, or a combination of all three. You land a solid strike."},{"id":262,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You weave sideways and try to slip out of the stranger's reach."},{"id":263,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You duck under the stranger's wildly swinging fists. He stumbles past you, carried by the force of his blow, and almost tumbles over the bed. You end up behind him, just by the open cabin door."},{"id":264,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"The stranger is unbalanced, and you have the better position. You lunge forward and attack."},{"id":265,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You surge forward, strike, and land a devastating blow. You put all your strength behind it. A jarring impact shoots up your arm. You definitely made contact."},{"id":266,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"A sense of déjà vu washes over you. This campsite… It's the same one. You hear a rustling from inside the tent. Your noisy arrival clearly woke up whoever is inside. A sing-song voice calls out, \"Hello?\" Your stomach sinks. You recognize that voice. The tent flap unzips, and the same man steps out.…"},{"id":267,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Your steak knife sinks deep into the stranger's belly. He lets out a high-pitched whine and stumbles back. He pats frantically at his stomach, leaving great bloody smears across the front of his clothes."},{"id":268,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Your hammer thuds into the stranger's face with a sickening crunch. He twirls like a top and crumples into a heap. You see a spray of blood and teeth, which clatter to the ground just after he does."},{"id":269,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"The axe! The one you found by the front door! You brought it inside, thank God. You hurry over to where it rests up against the wall and take the massive weapon in your hands. It's heavy, but as you lift it you feel a certainty that you've leveled the playing field against this lunatic."},{"id":270,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Your fist lands but he doesn't budge. You curse. His jaw was hard. You feel your knuckles bruise."},{"id":271,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You drive the ornate dagger to its hilt into the center of his chest."},{"id":272,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You try to duck out of the way, but one of the stranger's thick, meaty fists catches you in the jaw."},{"id":273,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You cry out and swing the axe down, double-handed, from above your head. The heavy, steel end collides with the stranger's skull. It splits his face in two. He goes down suddenly and immediately. The axe is pulled from your grasp. It's lodged solidly inside the stranger's skull."},{"id":274,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Even in an inferior position, the stranger is too fast for you. He whirls about and your attack swings wide. While you're recovering, he snarls, lunges, and drives his fist into your gut. You crumple up and stagger back. All the wind has been immediately knocked out of you."},{"id":275,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You made a lot of noise when you pushed through the trees into the clearing. Something rustles inside the tent. You've clearly woken up whoever is inside."},{"id":276,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"It will always be worth it,\" you say. \"I love you, and I'll always love you.\" Alex's face remains impassive. Then, it splits into a warm smile."},{"id":277,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You can't let Alex throw everything away. You try pleading with them."},{"id":278,"scene":"cabin","end":true,"system":false,"trigger":null,"roll":false,"snippet":"Something inside you gives up. There is a sweet serenity in refusing to struggle. The stranger's hands on you feel like warm tongues, clinging to your body."},{"id":279,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You dash across the clearing and cling to Alex. \"Oh my God! I've been so worried!\" You hold them close against you."},{"id":280,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You spin around. There, standing on the edge of the clearing, is Alex. Their clothes are flaked with mud and dirt. There are twigs caught in their hair. But they're here. They're alive. They're smiling at you."},{"id":281,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"Really?\" Alex asks."},{"id":282,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You struggle and try to break free of the stranger's grip. There's no way you're giving up without a fight. You lash out, kick, shout, and do everything you can to escape."},{"id":283,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You thrash and heave. It takes a herculean effort, but eventually you wedge yourself against the stranger and yank your body out of his grip. You scramble out of his reach. He snarls in frustration. \"The Child will have you!\" he bellows. \"You will serve the Child!\""},{"id":284,"scene":"cabin","end":true,"system":false,"trigger":null,"roll":false,"snippet":"You're pinned to the floor. The stranger's weight is immense. He's somehow getting stronger. You can't move. You can hardly breathe. He holds you fast with both his hands. With both his legs. With a second set of hands. With three sets…"},{"id":285,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"Charlie,\" he says."},{"id":286,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":false,"snippet":"\"What the hell is going on?!\""},{"id":287,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You rush the man while he is still halfway through the window."},{"id":288,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You rush over to the window and slam your body into the stranger with all your might. He hurtles backwards and falls out the window into the night. He hits the gravel outside. You hear him groan."},{"id":289,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"Paranoia wracks your mind."},{"id":290,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"As you step out into the darkness, a tiny voice in the back of your mind screams at you to stay in the cabin where it's safe. You can't bring yourself to do it. Anywhere out there has got to be better than here. You're basically a sitting duck trapped inside these walls."},{"id":291,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You try to shove the stranger out the window, but he catches your arm and tosses you back. It seems easy for him. He's unnaturally strong."},{"id":292,"scene":"clearing","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You push the door open, ready to run. You feel the cool air wash over you. Something about it gives you pause. You take long, slow breaths. You calm the beating of your heart."},{"id":293,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You scramble out of the tub. You open the bathroom door and race into the cabin. Behind you, the stranger grunts as he slithers through the window. He's almost inside!"},{"id":294,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You step out of the tub and quietly open the bathroom door."},{"id":295,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"Your foot sets down on a loose floorboard and you hear a loud creak. It echoes loudly. The stranger roars. The noise comes from just outside. Before you can react, he bursts into the room and lunges for you."},{"id":296,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You switch the flashlight off but keep it close. You carefully step into the main room of the cabin. You scout out the floorboards cautiously, stepping only on those that won't creak."},{"id":297,"scene":"cabin","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You wait, huddled in the tub. It's silent for several minutes. Maybe the stranger has gone for good. Maybe he's given up?"},{"id":298,"scene":"forest","end":false,"system":false,"trigger":null,"roll":true,"snippet":"You dash out into the night, running as far and fast as your body can manage. The cold air burns your lungs. The surrounding trees sound alien as they rustle, making you all the more terrified. Every few minutes, you emerge from the trees to a section of dirt road. You keep praying that you'll see …"},{"id":299,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You pick one pathway and follow it. Even after hurrying on for what feels like ages, you can't tell if you made the right call. The flashlight you carry is the only way you can see your surroundings. The only thing you can tell is that the forest is quieter here."},{"id":300,"scene":"forest","end":false,"system":false,"trigger":null,"roll":false,"snippet":"You're thankful that you took some time to sleep earlier— you're rested enough that you don't feel as though you need to stop for too long. You wait for just long enough that your legs stop aching, then get up and continue on you
