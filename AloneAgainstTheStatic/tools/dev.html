<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Alone Against the Static — narzędzie autorskie</title>
    <style>
      body { font-family: ui-monospace, monospace; background: #0a0a0c; color: #cfcfd6; padding: 2rem; }
      table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
      td, th { border: 1px solid #23232b; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
      a { color: #00d8ff; }
      .warn { color: #ff3a6a; }
      .muted { color: #6c6c78; }
    </style>
  </head>
  <body>
    <h1>Paragrafy</h1>
    <p>Lista wyekstrahowanych paragrafów z podglądem mechaniki. Służy do sprawdzania danych i podpinania mediów — nie jest częścią gry.</p>
    <p id="summary" class="muted"></p>
    <table id="list"><thead><tr><th>#</th><th>Scena</th><th>Tekst</th><th>PL</th><th>Znaczniki</th><th>Mechanika</th><th>Przejścia</th><th>Media</th></tr></thead><tbody></tbody></table>

    <script type="module">
      import { tagCounts } from "../src/ui/markup.js";
      const base = new URL("../data/", import.meta.url);
      const load = (n) => fetch(new URL(n, base)).then((r) => r.json());
      const [story, en, pl, media] = await Promise.all([
        load("story.json"), load("text.en.json"), load("text.pl.json"), load("media.json"),
      ]);
      const body = document.querySelector("#list tbody");
      const escape = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      const ids = Object.keys(story.entries).map(Number).sort((a, b) => a - b);
      let translated = 0;
      let total = 0;

      for (const id of ids) {
        const entry = story.entries[id];
        const row = document.createElement("tr");
        const targets = [
          ...(entry.choices ?? []).map((c) => c.goto),
          ...(entry.guards ?? []).map((g) => g.goto),
        ];
        const keys = [...(entry.text ?? []), ...(entry.choices ?? []).map((c) => c.text)];
        const done = keys.filter((k) => (pl[k] ?? "").trim().length > 0).length;
        translated += done;
        total += keys.length;
        const hasAudio = Boolean(media.entries?.[id]?.audio);
        const hasImage = Boolean(media.entries?.[id]?.image);
        const tags = [...new Set(keys.flatMap((k) => Object.keys(tagCounts(pl[k] || en[k] || ""))))];
        row.innerHTML = `
          <td>${id}</td>
          <td>${entry.scene ?? "<span class='warn'>brak</span>"}</td>
          <td>${(entry.text ?? []).map((k) => (en[k] ? escape(en[k]) : `<span class='warn'>${k}</span>`)).join(" ").slice(0, 160)}…</td>
          <td>${done === keys.length ? "✓" : `<span class='warn'>${done}/${keys.length}</span>`}</td>
          <td>${tags.join(" ") || "<span class='warn'>—</span>"}</td>
          <td>${escape(JSON.stringify(entry.on ?? []))}</td>
          <td>${targets.join(", ") || "—"}${entry.end ? " KONIEC" : ""}</td>
          <td>${hasAudio ? "♪" : "—"} ${hasImage ? "▣" : "—"}</td>`;
        body.append(row);
      }

      document.querySelector("#summary").textContent =
        `${ids.length} paragrafów, zakres przepisany ${story.extracted.join("–")}, tłumaczenie ${translated}/${total} kluczy.`;
    </script>
  </body>
</html>
