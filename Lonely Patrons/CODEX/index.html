<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lonely Patrons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-grain"></div>

  <header id="app-header">
    <div class="header-brand">
      <p class="header-eyebrow">Solo journaling companion</p>
      <span class="header-title">Lonely Patrons</span>
    </div>
    <div class="header-actions">
      <div class="lang-toggle">
        <button id="btn-lang-pl" class="lang-btn" type="button" onclick="UI.setLanguage('pl')">PL</button>
        <button id="btn-lang-en" class="lang-btn" type="button" onclick="UI.setLanguage('en')">EN</button>
      </div>
      <button id="btn-new-session" type="button" onclick="UI.confirmNewSession()">
        <span data-i18n="btn.newSession">Nowa sesja</span>
      </button>
    </div>
  </header>

  <main id="tab-content">
    <div class="hero-panel">
      <div>
        <p class="hero-kicker">Parchment oracle sheet</p>
        <h1>Arrival, work loop, and ending in one static web app.</h1>
      </div>
      <p class="hero-copy">
        Roll tables, track work points, and keep the whole story visible without leaving the page.
      </p>
    </div>

    <section id="tab-arrival" class="tab-panel">
      <div class="panel-card">
        <div class="section-header">
          <h2 data-i18n="section.landscape">Krajobraz</h2>
        </div>
        <div id="rolls-landscape" class="rolls-group"></div>
      </div>

      <div class="panel-card">
        <div class="section-header">
          <h2 data-i18n="section.patron">Patron</h2>
        </div>
        <div id="rolls-patron" class="rolls-group"></div>
      </div>
    </section>

    <section id="tab-day" class="tab-panel hidden">
      <div class="panel-card">
        <div class="subtabs">
          <button class="subtab-btn active" data-subtab="morning" type="button" onclick="UI.showSubtab('morning')">
            <span data-i18n="subtab.morning">Rano</span>
          </button>
          <button class="subtab-btn" data-subtab="afternoon" type="button" onclick="UI.showSubtab('afternoon')">
            <span data-i18n="subtab.afternoon">Popołudnie</span>
          </button>
          <button class="subtab-btn" data-subtab="night" type="button" onclick="UI.showSubtab('night')">
            <span data-i18n="subtab.night">Noc</span>
          </button>
        </div>

        <div id="subtab-morning" class="subtab-panel">
          <div id="wp-tracker"></div>
          <div id="rolls-morning" class="rolls-group"></div>
          <div id="improvement-section"></div>
          <button class="btn-secondary" type="button" onclick="UI.newDay()">
            <span data-i18n="btn.newDay">Nowy dzień →</span>
          </button>
        </div>

        <div id="subtab-afternoon" class="subtab-panel hidden">
          <div id="rolls-afternoon" class="rolls-group"></div>
        </div>

        <div id="subtab-night" class="subtab-panel hidden">
          <div id="rolls-night" class="rolls-group"></div>
        </div>
      </div>
    </section>

    <section id="tab-ending" class="tab-panel hidden">
      <div class="panel-card">
        <div id="rolls-ending" class="rolls-group"></div>
      </div>
    </section>

    <section id="tab-summary" class="tab-panel hidden">
      <div class="panel-card summary-card">
        <div id="summary-content"></div>
        <button class="btn-secondary" type="button" onclick="UI.copySummary()">
          <span data-i18n="btn.copy">📋 Kopiuj</span>
        </button>
      </div>
    </section>
  </main>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-tab="arrival" type="button" onclick="UI.showTab('arrival')">
      <span class="nav-icon">🏕</span>
      <span class="nav-label" data-i18n="tab.arrival">Przybycie</span>
    </button>
    <button class="nav-btn" data-tab="day" type="button" onclick="UI.showTab('day')">
      <span class="nav-icon">☀</span>
      <span class="nav-label" id="day-tab-label">Dzień 1</span>
    </button>
    <button class="nav-btn" data-tab="ending" type="button" onclick="UI.showTab('ending')">
      <span class="nav-icon">🌙</span>
      <span class="nav-label" data-i18n="tab.ending">Zakończenie</span>
    </button>
    <button class="nav-btn" data-tab="summary" type="button" onclick="UI.showTab('summary')">
      <span class="nav-icon">📜</span>
      <span class="nav-label" data-i18n="tab.summary">Podsumowanie</span>
    </button>
  </nav>

  <button id="btn-adj-float" type="button" onclick="UI.openAdjectiveOverlay()">
    <span data-i18n="btn.adjective">🎲</span>
  </button>

  <div id="adj-overlay" class="overlay hidden">
    <div class="overlay-card">
      <div class="overlay-title" data-i18n="adj.title">Przymiotnik</div>
      <div id="adj-result" class="overlay-result">—</div>
      <div id="adj-number" class="overlay-number"></div>
      <div class="overlay-actions">
        <button type="button" onclick="UI.rollAdjective()" data-i18n="adj.new">↺ Nowy</button>
        <button type="button" onclick="UI.closeAdjectiveOverlay()" data-i18n="adj.close">✕ Zamknij</button>
      </div>
    </div>
  </div>

  <script src="js/tables.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
